<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NS-ETF — Combined ETF Strategy</title>
<script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
<style>
:root { --bg:#0d1117; --panel:#161b22; --border:#30363d; --txt:#e6edf3;
        --dim:#8b949e; --green:#3fb950; --red:#f85149; --amber:#d29922; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--txt);
       font:13px/1.45 -apple-system,"SF Mono",Menlo,monospace; }
header { padding:10px 16px; border-bottom:1px solid var(--border);
         display:flex; align-items:baseline; gap:14px; }
header h1 { font-size:15px; margin:0; }
header .sub { color:var(--dim); font-size:11px; }
main { padding:12px 16px; display:grid;
       grid-template-columns: 2fr 1fr; gap:12px; }
.panel { background:var(--panel); border:1px solid var(--border);
         border-radius:8px; padding:12px; }
.panel h2 { font-size:12px; text-transform:uppercase; letter-spacing:.08em;
            color:var(--dim); margin:0 0 8px; }
canvas { max-width:100%; }
table { width:100%; border-collapse:collapse; }
th,td { text-align:left; padding:4px 8px; border-bottom:1px solid var(--border); }
th { color:var(--dim); font-weight:600; font-size:11px; }
td.num { text-align:right; font-variant-numeric:tabular-nums; }
.pos { color:var(--green); } .neg { color:var(--red); }
.badge { display:inline-block; padding:1px 7px; border-radius:10px;
         font-size:10px; border:1px solid var(--amber); color:var(--amber); }
.crisis { color:var(--red); font-weight:700; }
.kv { display:grid; grid-template-columns:auto 1fr; gap:2px 12px; font-size:12px; }
.kv .k { color:var(--dim); }
#status { font-size:11px; color:var(--dim); }
.full { grid-column: 1 / -1; }
</style>
</head>
<body>
<header>
  <h1>NS-ETF</h1>
  <span class="sub">Combined ETF Strategy · parallel-run with NS-1/3/4</span>
  <span id="status"></span>
</header>
<main>
  <section class="panel full">
    <h2>Strategy vs SPY <span style="text-transform:none">(normalized, with VIX spot / avg)</span></h2>
    <canvas id="perfChart" height="90"></canvas>
  </section>

  <section class="panel">
    <h2>Sleeves &amp; Weights</h2>
    <table id="sleeveTable"><thead>
      <tr><th>Ticker</th><th>Sleeve</th><th class="num">Weight</th></tr>
    </thead><tbody></tbody></table>
  </section>

  <section class="panel">
    <h2>State</h2>
    <div class="kv" id="stateBox"></div>
  </section>

  <section class="panel full">
    <h2>Sector Ratios — Advisory Panel <span class="badge">ADVISORY ONLY · zero allocation impact</span></h2>
    <table id="ratioTable"><thead>
      <tr><th>Ratio</th><th>Name</th><th class="num">Last</th>
          <th class="num">RSI</th><th class="num">ADX</th><th>Trend</th></tr>
    </thead><tbody></tbody></table>
  </section>
</main>
<script>
const dc = { green:'#3fb950', red:'#f85149', amber:'#d29922' };
let perfChart = null;

// Crosshair: vertical line follows the hovered date (NS-1 chart UX).
const crosshair = {
  type: 'line', xref: 'x', yref: 'paper',
  x0: null, x1: null, y0: 0, y1: 1,
  line: { color: '#8b949e', width: 1, dash: 'dot' }, visible: false,
};
const layout = {
  paper_bgcolor: '#161b22', plot_bgcolor: '#161b22',
  font: { color: '#e6edf3', size: 11, family: '-apple-system,Menlo,monospace' },
  margin: { l: 50, r: 55, t: 10, b: 28 },
  showlegend: true,
  legend: { orientation: 'h', y: 1.12, x: 0 },
  hovermode: 'x unified',
  // LEFT axis = VIX (PM spec); strategy/SPY rebased on RIGHT.
  yaxis: {
    title: { text: 'VIX', font: { color: '#f85149', size: 10 } },
    side: 'left', gridcolor: '#30363d', tickfont: { color: '#f85149', size: 10 },
    rangemode: 'tozero',
  },
  yaxis2: {
    overlaying: 'y', side: 'right', gridcolor: 'transparent',
    tickfont: { color: '#8b949e', size: 10 },
  },
  xaxis: { gridcolor: '#30363d', tickfont: { color: '#8b949e' } },
  shapes: [crosshair],
};

function renderPerf(p) {
  if (p.error) { document.getElementById('status').textContent = 'perf: ' + p.error; return; }
  const hasVix = p.vix_series && p.vix_series.some(v => v !== null);
  const traces = [
    { x: p.dates, y: p.strategy, name: 'NS-ETF (right)',
      type: 'scatter', mode: 'lines', yaxis: 'y2',
      line: { color: '#3fb950', width: 2 } },
    { x: p.dates, y: p.spy, name: 'SPY (right)',
      type: 'scatter', mode: 'lines', yaxis: 'y2',
      line: { color: '#8b949e', width: 1.4 } },
  ];
  if (hasVix) {
    traces.push({ x: p.dates, y: p.vix_series, name: 'VIX spot (left)',
      type: 'scatter', mode: 'lines', yaxis: 'y',
      line: { color: '#f85149', width: 1, dash: 'dot' } });
    if (p.vix_avg_series && p.vix_avg_series.some(v => v !== null)) {
      traces.push({ x: p.dates, y: p.vix_avg_series, name: 'VIX avg (left)',
        type: 'scatter', mode: 'lines', yaxis: 'y',
        line: { color: '#d29922', width: 1, dash: 'dash' } });
    }
  }
  Plotly.react('perfChart', traces, layout, { responsive: true, displayModeBar: false });
  const st = document.getElementById('status');
  st.textContent = (p.vix && p.vix.spot != null)
    ? 'VIX spot ' + Number(p.vix.spot).toFixed(2) + ' · avg ' + Number(p.vix.avg).toFixed(2)
    : '';
}

// Crosshair wiring: move the shape to the hovered x; hide on leave.
const chartEl = document.getElementById('perfChart');
chartEl.on ? null : null;   // set after first plot via Plotly.attach
function wireCrosshair() {
  chartEl.removeAllListeners && chartEl.removeAllListeners('plotly_hover');
  chartEl.on('plotly_hover', ev => {
    crosshair.x0 = crosshair.x1 = ev.xs ? ev.xs[ev.pointindex || 0] || ev.xs[0] : null;
    crosshair.visible = crosshair.x0 != null;
    Plotly.relayout('perfChart', { 'shapes[0].x0': crosshair.x0, 'shapes[0].x1': crosshair.x1, 'shapes[0].visible': crosshair.visible });
  });
  chartEl.on('plotly_unhover', () => {
    crosshair.visible = false;
    Plotly.relayout('perfChart', { 'shapes[0].visible': false });
  });
}

async function jget(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(url + ' → ' + r.status);
  return r.json();
}


function renderFeed(f) {
  const tb = document.querySelector('#sleeveTable tbody');
  tb.innerHTML = '';
  for (const [t, w] of Object.entries(f.weights || {}).sort((a,b)=>b[1]-a[1])) {
    const sleeve = (f.sleeves.defensive.weights && f.sleeves.defensive.weights[t] != null) ? 'defensive'
                 : (f.sleeves.real_asset.weights && f.sleeves.real_asset.weights[t] != null) ? 'real_asset' : '—';
    const tr = document.createElement('tr');
    tr.innerHTML = '<td>'+t+'</td><td>'+sleeve+'</td><td class="num">'+(100*w).toFixed(1)+'%</td>';
    tb.appendChild(tr);
  }
  const sb = document.getElementById('stateBox');
  const crisis = f.crisis_mode
    ? '<span class="crisis">CRISIS</span>'
    : (f.vix && f.vix.state ? f.vix.state : '—');
  sb.innerHTML =
    '<span class="k">as_of</span><span>'+f.as_of+'</span>' +
    '<span class="k">VIX state</span><span>'+crisis+'</span>' +
    '<span class="k">exposure cap</span><span>'+(f.vix && f.vix.exposure_cap != null ? f.vix.exposure_cap : '—')+'</span>' +
    '<span class="k">regime</span><span>'+(f.regime && (f.regime.regime || f.regime.hmm_state || '—'))+'</span>' +
    '<span class="k">events</span><span>'+(f.events ? f.events.length : 0)+'</span>';
}

function renderAdvisory(panel) {
  const tb = document.querySelector('#ratioTable tbody');
  tb.innerHTML = '';
  for (const r of panel) {
    if (r.error) continue;                       // skip error rows (NS-4 lesson)
    const tr = document.createElement('tr');
    const cls = r.trend === 'UP' ? 'pos' : (r.trend === 'DOWN' ? 'neg' : '');
    tr.innerHTML = '<td>'+r.ratio+'</td><td>'+r.name+'</td>' +
      '<td class="num">'+r.last+'</td>' +
      '<td class="num">'+(r.rsi != null ? r.rsi : '—')+'</td>' +
      '<td class="num">'+(r.adx != null ? r.adx : '—')+'</td>' +
      '<td class="'+cls+'">'+r.trend+'</td>';
    tb.appendChild(tr);
  }
}

async function loadAll() {
  try {
    const feed = await jget('/api/signals');
    renderFeed(feed);
    renderAdvisory(feed.advisory_sector_ratios || []);
  } catch (e) {
    document.getElementById('status').textContent = 'feed unavailable: ' + e.message;
  }
  try {
    renderPerf(await jget('/api/performance'));
    if (chartEl.on && !chartEl._crosshairWired) {   // attach once after first plot
      chartEl._crosshairWired = true;
      wireCrosshair();
    }
  } catch (e) { /* status shown */ }
}
loadAll();
setInterval(loadAll, 300000);
</script>
</body>
</html>
