<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NS-4: Ratio Trading System</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0f; color: #e8e8f0; min-height: 100vh; }
.header { background: #161b22; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e1e2e; }
.header h1 { font-size: 18px; font-weight: 600; color: #4ade80; }
.toolbar { background: #161b22; padding: 12px 24px; display: flex; gap: 12px; align-items: center; border-bottom: 1px solid #1e1e2e; flex-wrap: wrap; }
.btn { background: #238636; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; }
.btn:hover { background: #2ea043; }
.btn-secondary { background: #21262d; border: 1px solid #30363d; color: #e6edf3; }
.btn-secondary:hover { background: #30363d; }
.search { background: #0d1117; border: 1px solid #30363d; color: #e6edf3; padding: 8px 12px; border-radius: 6px; width: 200px; }
.select-input { background: #0d1117; border: 1px solid #30363d; color: #e6edf3; padding: 8px 12px; border-radius: 6px; }
.main { padding: 24px; display: flex; flex-direction: column; gap: 20px; }
.chart-container { background: #161b22; border-radius: 8px; padding: 20px; height: 450px; position: relative; }
.sub-chart { background: #161b22; border-radius: 8px; padding: 20px; height: 280px; }
.chart-tabs { display: flex; gap: 8px; position: absolute; top: 15px; right: 20px; z-index: 10; }
.chart-tab { background: none; border: none; color: #8b949e; padding: 6px 12px; cursor: pointer; border-radius: 4px; }
.chart-tab.active { background: #21262d; color: #e6edf3; }
.tabs { display: flex; gap: 4px; background: #161b22; padding: 8px 24px; border-radius: 8px; }
.tab { background: transparent; border: none; color: #8b949e; padding: 10px 20px; cursor: pointer; border-radius: 6px; font-size: 14px; }
.tab.active { background: #238636; color: white; }
.data-table-container { background: #161b22; border-radius: 8px; overflow-x: auto; border: 1px solid #30363d; }
.data-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.data-table th { padding: 12px 8px; background: #21262d; color: #8b949e; text-align: left; font-weight: 600; text-transform: uppercase; border-bottom: 1px solid #30363d; position: sticky; top: 0; white-space: nowrap; }
.data-table td { padding: 10px 8px; border-bottom: 1px solid #21262d; text-align: left; white-space: nowrap; }
.data-table .num { font-family: 'Monaco', monospace; text-align: right; }
.data-table .num.positive { color: #3fb950; }
.data-table .num.negative { color: #f85149; }
.data-table tr:hover td { background: #21262d; }
.info-bar { background: #161b22; padding: 12px 24px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; border: 1px solid #30363d; }
.info-bar .ticker { font-size: 20px; font-weight: 700; }
.info-bar .price { font-size: 20px; font-weight: 700; color: #f0883e; }
.loading { padding: 40px; text-align: center; color: #8b949e; }
.bullish { color: #3fb950; font-weight: 600; }
.bearish { color: #f85149; font-weight: 600; }
.neutral { color: #f0883e; font-weight: 600; }
.avoid { color: #8b949e; font-weight: 600; }
</style>
</head>
<body>
<div class="header">
<h1>NS-4: Ratio Trading System</h1>
</div>
<div class="toolbar">
<div class="watchlist-bar" style="display: flex; align-items: center; gap: 8px;">
<label style="color: #8b949e; font-size: 12px;">Sort by:</label>
<select id="sort-select" class="select-input" style="min-width: 140px;">
<option value="score">Score</option>
<option value="change">Change %</option>
<option value="rsi">RSI</option>
</select>
</div>
<button class="btn" onclick="refreshData()">Refresh</button>
<button class="btn btn-secondary" onclick="downloadCSV()">Download CSV</button>
</div>
<div class="tabs" id="tabs">
<button class="tab active" data-tab="all">All Ratios</button>
<button class="tab" data-tab="rankings">Rankings</button>
</div>

<div class="main" id="all-panel" style="display:block">
<div class="info-bar">
<div class="ticker">NS-4: Ratio Trading System</div>
<div class="price">15 Ratios Monitored</div>
</div>
<div class="data-table-container">
<table class="data-table" id="ratios-table">
<thead>
<tr>
<th>Symbol</th>
<th>Name</th>
<th>Numerator</th>
<th>Denominator</th>
<th class="num">Current</th>
<th class="num">Prev</th>
<th class="num">Change %</th>
<th class="num">Regime</th>
<th>RSI</th>
<th>MACD</th>
<th>ADX</th>
<th>BB Pos</th>
<th>ATR %</th>
<th>Signal</th>
<th class="num">Score</th>
<th>Reasons</th>
</tr>
</thead>
<tbody id="ratios-body"></tbody>
</table>
</div>
</div>

<div class="main" id="rankings-panel" style="display:none">
<div class="info-bar">
<div class="ticker">Rankings</div>
</div>
<div class="data-table-container">
<table class="data-table" id="rankings-table">
<thead>
<tr>
<th>Rank</th>
<th>Symbol</th>
<th>Name</th>
<th class="num">Score</th>
<th class="num">Change %</th>
<th class="num">RSI</th>
<th>Signal</th>
</tr>
</thead>
<tbody id="rankings-body"></tbody>
</table>
</div>
</div>

<script>
let currentData = null;

async function fetchAPI(url) {
const res = await fetch(url);
if (!res.ok) throw new Error(`HTTP ${res.status}`);
return res.json();
}

async function loadData() {
try {
const data = await fetchAPI('/api/v1/all');
document.querySelector(`.tab[data-tab="${tabName}"]`).classList.add('active');
document.getElementById(`${tabName}-panel`).style.display = 'block';
}

document.querySelectorAll('.tab').forEach(tab => {
tab.addEventListener('click', () => showTab(tab.dataset.tab));
});

async function loadData() {
try {
const data = await fetchAPI('/api/v1/all');
currentData = data;
renderRatios(data.ratios);
renderRankings(data.ratios);
} catch (e) {
document.getElementById('ratios-body').innerHTML = `<tr><td colspan="18" class="loading">Error: ${e.message}</td></tr>`;
}
}

function renderRatios(ratios) {
const tbody = document.getElementById('ratios-body');
tbody.innerHTML = ratios.map(r => `
<tr>
<td><strong>${r.symbol}</strong></td>
<td>${r.name}</td>
<td>${r.numerator}</td>
<td>${r.denominator}</td>
<td class="num">${r.current.toFixed(4)}</td>
<td class="num">${r.previous.toFixed(4)}</td>
<td class="num ${r.change_pct >= 0 ? 'positive' : 'negative'}">${r.change_pct >= 0 ? '+' : ''}${r.change_pct.toFixed(2)}%</td>
<td class="num">${r.regime}</td>
<td class="num">${r.indicators?.rsi?.toFixed(1) || 'N/A'}</td>
<td class="num">${r.indicators?.macd?.toFixed(4) || 'N/A'}</td>
<td class="num">${r.indicators?.adx?.toFixed(1) || 'N/A'}</td>
<td class="num">${r.indicators?.bb_position?.toFixed(2) || 'N/A'}</td>
<td class="num">${r.indicators?.atr_pct?.toFixed(2) || 'N/A'}</td>
<td class="${r.signal === 'ENTER LONG' ? 'bullish' : (r.signal === 'ENTER SHORT' ? 'bearish' : (r.signal.includes('HOLD') ? 'neutral' : 'avoid'))}">${r.signal}</td>
<td class="num">${r.score}</td>
<td>${(r.reasons || []).join(', ')}</td>
</tr>
`).join('');
}

function renderRankings(ratios) {
const valid = ratios.filter(r => !r.error).sort((a, b) => b.score - a.score);
const tbody = document.getElementById('rankings-body');
tbody.innerHTML = valid.map((r, i) => `
<tr>
<td>${i + 1}</td>
<td><strong>${r.symbol}</strong></td>
<td>${r.name}</td>
<td class="num">${r.score}</td>
<td class="num ${r.change_pct >= 0 ? 'positive' : 'negative'}">${r.change_pct >= 0 ? '+' : ''}${r.change_pct.toFixed(2)}%</td>
<td class="num">${r.indicators?.rsi?.toFixed(1) || 'N/A'}</td>
<td class="${r.signal === 'ENTER LONG' ? 'bullish' : (r.signal === 'ENTER SHORT' ? 'bearish' : (r.signal.includes('HOLD') ? 'neutral' : 'avoid'))}">${r.signal}</td>
</tr>
`).join('');
}

function downloadCSV() {
const tier = document.querySelector('.tab.active').dataset.tab;
let csv = '';
if (tier === 'all') {
csv = 'Symbol,Name,Numerator,Denominator,Current,Previous,Change%,Regime,RSI,MACD,ADX,BB_Position,ATR%,Signal,Score,Reasons\n';
csv += currentData.ratios.map(r => `"${r.symbol}","${r.name}","${r.numerator}","${r.denominator}",${r.current.toFixed(4)},${r.previous.toFixed(4)},${r.change_pct.toFixed(2)},${r.regime},${r.indicators?.rsi || ''},${r.indicators?.macd || ''},${r.indicators?.adx || ''},${r.indicators?.bb_position || ''},${r.indicators?.atr_pct || ''},"${r.signal}",${r.score},"${(r.reasons || []).join('; ')}"`).join('\n');
} else if (tier === 'rankings') {
csv = 'Rank,Symbol,Name,Score,Change%,RSI,Signal\n';
csv += currentData.ratios.filter(r => !r.error).sort((a,b) => b.score - a.score).map((r,i) => `${i+1},${r.symbol},"${r.name}",${r.score},${r.change_pct.toFixed(2)},${r.indicators?.rsi || ''},"${r.signal}"`).join('\n');
}
const blob = new Blob([csv], {type: 'text/csv'});
const url = URL.createObjectURL(blob);
const a = document.createElement('a');
a.href = url; a.download = `ns4_${tier}_${new Date().toISOString().slice(0,10)}.csv`;
a.click(); URL.revokeObjectURL(url);
}

function refreshData() {
loadData();
}

document.addEventListener('DOMContentLoaded', () => {
loadData();
});
</script>
</body>
</html>
