<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alpha Terminal</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0d1117;
            color: #e6edf3;
            min-height: 100vh;
        }
        .header {
            background: #161b22;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #30363d;
        }
        .header h1 { font-size: 20px; font-weight: 600; }
        
        .nav { display: flex; gap: 16px; }
        .nav a { color: #8b949e; text-decoration: none; padding: 8px 16px; border-radius: 6px; }
        .nav a.active { background: #21262d; color: #e6edf3; }
        
        .toolbar {
            background: #161b22;
            padding: 12px 24px;
            display: flex;
            gap: 12px;
            align-items: center;
            border-bottom: 1px solid #30363d;
        }
        .search {
            background: #0d1117;
            border: 1px solid #30363d;
            color: #e6edf3;
            padding: 8px 12px;
            border-radius: 6px;
            width: 200px;
        }
        .search:focus { outline: none; border-color: #58a6ff; }
        
        .btn {
            background: #238636;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        .btn:hover { background: #2ea043; }
        .btn-secondary {
            background: #21262d;
            border: 1px solid #30363d;
            color: #e6edf3;
        }
        .btn-secondary:hover { background: #30363d; }
        
        .main {
            padding: 24px;
            display: grid;
            grid-template-columns: 250px 1fr;
            gap: 24px;
        }
        
        .sidebar {
            background: #161b22;
            border-radius: 8px;
            padding: 16px;
        }
        .sidebar h3 {
            font-size: 12px;
            text-transform: uppercase;
            color: #8b949e;
            margin-bottom: 12px;
        }
        
        .watchlist-item {
            padding: 10px 12px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }
        .watchlist-item:hover { background: #21262d; }
        .watchlist-item.active { background: #21262d; border-left: 2px solid #58a6ff; }
        .watchlist-item .ticker { font-weight: 600; }
        .watchlist-item .price { color: #8b949e; font-size: 14px; transition: color 0.3s ease; }
        .watchlist-item.price-up .price { color: #3fb950; }
        .watchlist-item.price-down .price { color: #f85149; }
        
        .panel {
            background: #161b22;
            border-radius: 8px;
            padding: 24px;
        }
        
        .quote-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 24px;
        }
        .quote-header .ticker {
            font-size: 28px;
            font-weight: 700;
        }
        .quote-header .name {
            color: #8b949e;
            margin-top: 4px;
            font-size: 16px;
        }
        .quote-header .price-block {
            text-align: right;
        }
        .quote-header .price {
            font-size: 28px;
            font-weight: 700;
        }
        .quote-header .change {
            font-size: 20px;
            margin-top: 4px;
        }
        .change.positive { color: #3fb950; }
        .change.negative { color: #f85149; }
        
        .quote-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            margin-top: 24px;
        }
        .quote-stat {
            background: #0d1117;
            padding: 10px 12px;
            border-radius: 8px;
        }
        .quote-stat .label {
            font-size: 11px;
            color: #8b949e;
            text-transform: uppercase;
        }
        .quote-stat .value {
            font-size: 16px;
            font-weight: 600;
            margin-top: 2px;
        }
        
        .chart-container {
            margin-top: 24px;
            height: 400px;
            background: #0d1117;
            border-radius: 8px;
            padding: 16px;
        }
        
        .chart-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }
        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .chart-performance {
            color: #8b949e;
            font-size: 13px;
            font-family: monospace;
        }
        .chart-performance .positive { color: #3fb950; }
        .chart-performance .negative { color: #f85149; }
        .chart-tab {
            background: none;
            border: none;
            color: #8b949e;
            padding: 6px 12px;
            cursor: pointer;
            border-radius: 4px;
        }
        .chart-tab.active {
            background: #21262d;
            color: #e6edf3;
        }
        .log-toggle {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #8b949e;
            margin-left: 16px;
        }
        .log-toggle input {
            cursor: pointer;
        }
        
        .add-ticker {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }
        .add-ticker input {
            flex: 1;
        }

        /* --- 52-Week Highs panel --- */
        .yh-section {
            margin: 24px;
        }
        .yh-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .yh-header h2 {
            font-size: 18px;
            font-weight: 600;
            margin: 0;
        }
        .yh-header .date-label {
            color: #8b949e;
            font-size: 13px;
        }
        .yh-header input[type="date"] {
            background: #0d1117;
            border: 1px solid #30363d;
            color: #e6edf3;
            padding: 8px 12px;
            border-radius: 6px;
        }
        .yh-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        .yh-table th, .yh-table td {
            text-align: left;
            padding: 8px 12px;
            border-bottom: 1px solid #21262d;
        }
        .yh-table th {
            color: #8b949e;
            text-transform: uppercase;
            font-size: 11px;
            cursor: pointer;
            user-select: none;
        }
        .yh-table th:hover { color: #e6edf3; }
        .yh-table tbody tr:hover { background: #21262d; }
        .yh-table .ticker { font-weight: 600; }
        .yh-table .exch-nyse { color: #58a6ff; }
        .yh-table .exch-nasdaq { color: #3fb950; }
        .yh-table .pct-near { color: #3fb950; }
        .yh-empty, .yh-error {
            color: #8b949e;
            padding: 16px;
        }
        .yh-error { color: #f85149; }

</head>
<body>
    <div class="header">
        <div style="display: flex; align-items: center; gap: 12px;">
            <h1>🛠️ Alpha Terminal</h1>
            <div class="time" id="time" style="color: #8b949e; font-size: 14px;">--:--:--</div>
        </div>
        <div class="nav" style="display: flex; gap: 16px; margin-left: auto;">
            <a href="dashboard.html" class="active" style="background: #21262d; color: #e6edf3; text-decoration: none; padding: 8px 16px; border-radius: 6px;">Dashboard</a>
            <a href="omon.html" style="color: #8b949e; text-decoration: none; padding: 8px 16px; border-radius: 6px;">OMON</a>
            <a href="screener.html" style="color: #8b949e; text-decoration: none; padding: 8px 16px; border-radius: 6px;">Option Screener</a>
            <a href="ratio.html" style="color: #8b949e; text-decoration: none; padding: 8px 16px; border-radius: 6px;">Ratio Analysis</a>
            <a href="financials.html" style="color: #8b949e; text-decoration: none; padding: 8px 16px; border-radius: 6px;">Financial Analyzer</a>
            <a href="estimates.html">Earnings Estimates</a>
        </div>
    </div>
    
    <div class="toolbar">
        <input type="text" class="search" id="search" placeholder="Search ticker...">
        <button class="btn" onclick="addTicker()">Load</button>
    </div>
    
    <div class="main">
        <div class="sidebar">
            <h3>Watchlist</h3>
            <div id="watchlist"></div>
            <div class="add-ticker">
                <input type="text" class="search" id="addTickerInput" placeholder="Symbol">
                <button class="btn" onclick="addToWatchlist()">Add</button>
            </div>
        </div>
        
        <div class="panel" id="quotePanel">
            <div class="quote-header">
                <div>
                    <div class="ticker" id="qtTicker">--</div>
                    <div class="name" id="qtName">Select a ticker</div>
                </div>
                <div class="price-block">
                    <div class="price" id="qtPrice">--</div>
                    <div class="change" id="qtChange">--</div>
                </div>
            </div>
            
            <div class="quote-grid">
                <div class="quote-stat">
                    <div class="label">Open</div>
                    <div class="value" id="qtOpen">--</div>
                </div>
                <div class="quote-stat">
                    <div class="label">High</div>
                    <div class="value" id="qtHigh">--</div>
                </div>
                <div class="quote-stat">
                    <div class="label">Low</div>
                    <div class="value" id="qtLow">--</div>
                </div>
                <div class="quote-stat">
                    <div class="label">Volume</div>
                    <div class="value" id="qtVolume">--</div>
                </div>
                <div class="quote-stat">
                    <div class="label">52W High</div>
                    <div class="value" id="qt52wHigh">--</div>
                </div>
                <div class="quote-stat">
                    <div class="label">52W Low</div>
                    <div class="value" id="qt52wLow">--</div>
                </div>
                <div class="quote-stat">
                    <div class="label">Mkt Cap</div>
                    <div class="value" id="qtMktCap">--</div>
                </div>
                <div class="quote-stat">
                    <div class="label">P/E</div>
                    <div class="value" id="qtPE">--</div>
                </div>
                <div class="quote-stat">
                    <div class="label">Div Yield</div>
                    <div class="value" id="qtDivYield">--</div>
                </div>
            </div>
            
            <div class="chart-container">
                <div class="chart-header">
                    <div class="chart-tabs">
                        <button class="chart-tab" onclick="setTimeframe('1D')">1D</button>
                        <button class="chart-tab" onclick="setTimeframe('1W')">1W</button>
                        <button class="chart-tab" onclick="setTimeframe('1M')">1M</button>
                        <button class="chart-tab" onclick="setTimeframe('3M')">3M</button>
                        <button class="chart-tab" onclick="setTimeframe('YTD')">YTD</button>
                        <button class="chart-tab" onclick="setTimeframe('1Y')">1Y</button>
                        <button class="chart-tab" onclick="setTimeframe('5Y')">5Y</button>
                    </div>
                    <div class="chart-performance" id="chartPerf"></div>
                    <label class="log-toggle">
                        <input type="checkbox" id="logScale" onchange="toggleLogScale()">
                        Log Scale
                    </label>
                </div>
                <canvas id="chart"></canvas>
                </div>
                </div>
                </div>

                <div class="yh-section">
                <div class="yh-header">
                <h2>📈 52-Week Highs</h2>
                <span class="date-label">Session:</span>
                <input type="date" id="yhDate" onchange="yhLoad()">
                <input type="text" class="search" id="yhSearch" placeholder="Search ticker / sector…" oninput="yhSearchInput()">
                <button class="btn btn-secondary" onclick="yhLoad()">Reload</button>
                <span id="yhStatus" style="color:#8b949e; font-size:13px;"></span>
                </div>
                <div id="yhTableWrap">
                <table class="yh-table" id="yhTable">
                    <thead>
                        <tr>
                            <th data-k="ticker" onclick="yhSort('ticker')">Ticker</th>
                            <th data-k="company" onclick="yhSort('company')">Company</th>
                            <th data-k="sector" onclick="yhSort('sector')">Sector</th>
                            <th data-k="exchange" onclick="yhSort('exchange')">Exchange</th>
                            <th data-k="close" onclick="yhSort('close')">Price</th>
                            <th data-k="pct_off" onclick="yhSort('pct_off')">% off 52W High</th>
                            <th data-k="volume" onclick="yhSort('volume')">Volume</th>
                        </tr>
                    </thead>
                    <tbody id="yhBody"></tbody>
                </table>
                <div class="yh-empty" id="yhEmpty" style="display:none;">No 52-week highs stored for this session.</div>
                <div class="yh-error" id="yhError" style="display:none;"></div>
                </div>
                </div>

                <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        let quotes = {};
        let watchlist = [];
        try {
            watchlist = JSON.parse(localStorage.getItem('watchlist'));
        } catch(e) { console.warn("localStorage not available", e); }
        
        if (!watchlist || !watchlist.length) {
            watchlist = ['AAPL', 'AMZN', 'GLD', 'GOOGL', 'MSFT', 'NVDA', 'QQQ', 'SMH', 'SPY', 'TSLA', 'XLE'];
            try { localStorage.setItem('watchlist', JSON.stringify(watchlist)); } catch(e) {}
        }
        watchlist.sort(); // Ensure it's always sorted alphabetically
        let currentTicker = watchlist[0] || 'SPY';
        let chart = null;
        let timeframe = '1D';
        let useLogScale = false;
        
        // Remove from watchlist
        function removeFromWatchlist(t) {
            watchlist = watchlist.filter(item => item !== t);
            try { localStorage.setItem('watchlist', JSON.stringify(watchlist)); } catch(e) {}
            renderWatchlist();
            if (t === currentTicker && watchlist.length > 0) {
                selectTicker(watchlist[0]);
            }
        }
        
        // Update time
        function updateTime() {
            const now = new Date();
            const timeEl = document.getElementById('time');
            if (timeEl) timeEl.textContent = now.toLocaleTimeString();
        }
        setInterval(updateTime, 1000);
        updateTime();
        
        // Fetch quotes
        async function fetchQuotes() {
            let fetchList = [...watchlist];
            if (currentTicker && !fetchList.includes(currentTicker)) {
                fetchList.push(currentTicker);
            }
            const tickers = fetchList.join(',');
            try {
                const res = await fetch(`/api/quotes?tickers=${tickers}`);
                const newQuotes = await res.json();
                
                // Process for "flash" updates
                Object.keys(newQuotes).forEach(ticker => {
                    const oldPrice = quotes[ticker]?.price;
                    const newPrice = newQuotes[ticker]?.price;
                    if (oldPrice && newPrice && oldPrice !== newPrice) {
                        newQuotes[ticker].flash = newPrice > oldPrice ? 'price-up' : 'price-down';
                    }
                });
                
                quotes = newQuotes;
                renderWatchlist();
                renderQuote(currentTicker);
            } catch (e) {
                console.error('Fetch error:', e);
            }
        }
        
        // Render watchlist
        function renderWatchlist() {
            const el = document.getElementById('watchlist');
            el.innerHTML = watchlist.map(t => {
                const q = quotes[t] || {};
                const price = q.price ? q.price.toFixed(2) : '--';
                const change = q.change_pct ? q.change_pct.toFixed(2) + '%' : '--';
                const cls = q.change_pct > 0 ? 'positive' : q.change_pct < 0 ? 'negative' : '';
                const flash = q.flash || '';
                
                return `
                    <div class="watchlist-item ${t === currentTicker ? 'active' : ''} ${flash}" onclick="selectTicker('${t}')">
                        <span class="ticker">${t}</span>
                        <div style="display: flex; align-items: center;">
                            <span class="price">${price}</span>
                            <span class="change ${cls}" style="margin-left: 8px;">${change}</span>
                            <span onclick="event.stopPropagation(); removeFromWatchlist('${t}')" style="margin-left: 8px; color: #f85149; cursor: pointer; font-size: 14px; font-weight: bold;" title="Remove">&times;</span>
                        </div>
                    </div>
                `;
            }).join('');

            // Clear flash after animation
            setTimeout(() => {
                document.querySelectorAll('.watchlist-item').forEach(el => {
                    el.classList.remove('price-up', 'price-down');
                });
            }, 1000);
        }
        
        // Select ticker
        function selectTicker(t) {
            currentTicker = t;
            if (!quotes[t]) {
                fetchQuotes(); // Fetch data if we don't have it
            } else {
                renderWatchlist();
                renderQuote(t);
            }
            fetchChart(t, timeframe);
        }
        
        // Render quote
        function renderQuote(t) {
            const q = quotes[t] || {};
            document.getElementById('qtTicker').textContent = t;
            document.getElementById('qtName').textContent = q.name || '--';
            document.getElementById('qtPrice').textContent = q.price ? '$' + q.price.toFixed(2) : '--';
            
            const changeEl = document.getElementById('qtChange');
            if (q.change != null) {
                const sign = q.change >= 0 ? '+' : '';
                changeEl.textContent = sign + q.change.toFixed(2) + ' (' + sign + q.change_pct.toFixed(2) + '%)';
                changeEl.className = 'change ' + (q.change >= 0 ? 'positive' : 'negative');
            } else {
                changeEl.textContent = '--';
                changeEl.className = 'change';
            }
            
            document.getElementById('qtOpen').textContent = q.open ? '$' + q.open.toFixed(2) : '--';
            document.getElementById('qtHigh').textContent = q.high ? '$' + q.high.toFixed(2) : '--';
            document.getElementById('qtLow').textContent = q.low ? '$' + q.low.toFixed(2) : '--';
            document.getElementById('qtVolume').textContent = q.volume ? formatNumber(q.volume) : '--';
            document.getElementById('qt52wHigh').textContent = q['52w_high'] ? '$' + q['52w_high'].toFixed(2) : '--';
            document.getElementById('qt52wLow').textContent = q['52w_low'] ? '$' + q['52w_low'].toFixed(2) : '--';
            document.getElementById('qtMktCap').textContent = q.market_cap ? formatNumber(q.market_cap) : '--';
            document.getElementById('qtPE').textContent = q.pe_ratio ? q.pe_ratio.toFixed(2) : '--';
            document.getElementById('qtDivYield').textContent = q.dividend_yield ? q.dividend_yield.toFixed(2) + '%' : '--';
            
            // Update chart performance header for current timeframe
            updatePerformanceDisplay(timeframe);
        }
        
        // Format number
        function formatNumber(n) {
            if (n >= 1e12) return (n / 1e12).toFixed(2) + 'T';
            if (n >= 1e9) return (n / 1e9).toFixed(2) + 'B';
            if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
            if (n >= 1e3) return (n / 1e3).toFixed(2) + 'K';
            return n;
        }
        
        // Load chart only (does NOT add to watchlist)
        function loadChartOnly() {
            const input = document.getElementById('search');
            const t = input.value.toUpperCase().trim();
            if (t) {
                selectTicker(t);
            }
            input.value = '';
        }
        
        // Add ticker from search to watchlist (does NOT load chart)
        function addToWatchlistFromSearch() {
            const input = document.getElementById('search');
            const t = input.value.toUpperCase().trim();
            if (t && !watchlist.includes(t)) {
                watchlist.push(t);
                watchlist.sort();
                try { localStorage.setItem('watchlist', JSON.stringify(watchlist)); } catch(e) {}
                fetchQuotes();
            }
            input.value = '';
        }
        
        // Load chart only (does NOT add to watchlist)
        function addTicker() {
            const input = document.getElementById('search');
            const t = input.value.toUpperCase().trim();
            if (t) {
                selectTicker(t);
            }
            input.value = '';
        }
        
        function addToWatchlist() {
            const input = document.getElementById('addTickerInput');
            const t = input.value.toUpperCase().trim();
            if (t && !watchlist.includes(t)) {
                watchlist.push(t);
                watchlist.sort();
                try { localStorage.setItem('watchlist', JSON.stringify(watchlist)); } catch(e) {}
                fetchQuotes();
            }
            input.value = '';
        }
        
        // Refresh
        function refresh() {
            fetchQuotes();
            fetchChart(currentTicker, timeframe);
        }
        
        // Timeframe
        function toggleLogScale() {
            useLogScale = document.getElementById('logScale').checked;
            if (currentTicker) {
                fetchChart(currentTicker, timeframe);
            }
        }
        
        function setTimeframe(tf) {
            timeframe = tf;
            document.querySelectorAll('.chart-tab').forEach(b => b.classList.remove('active'));
            const tabs = Array.from(document.querySelectorAll('.chart-tab'));
            const activeTab = tabs.find(t => t.textContent === tf);
            if (activeTab) activeTab.classList.add('active');
            fetchChart(currentTicker, tf);
            updatePerformanceDisplay(tf);
        }
        
        // Update performance display based on selected timeframe
        function updatePerformanceDisplay(tf) {
            const q = quotes[currentTicker];
            const perfEl = document.getElementById('chartPerf');
            if (!perfEl || !q) return;
            
            const ret = q['ret_' + tf.toLowerCase().replace('ytd', 'ytd').replace('1d', '1d').replace('1w', '1w').replace('1m', '1m').replace('3m', '3m').replace('1y', '1y').replace('5y', '5y')];
            if (ret !== undefined) {
                const cls = ret >= 0 ? 'positive' : 'negative';
                const label = tf === '1D' ? 'Today' : tf === '1W' ? '1W' : tf === '1M' ? '1M' : tf === '3M' ? '3M' : tf === 'YTD' ? 'YTD' : tf === '1Y' ? '1Y' : '5Y';
                perfEl.innerHTML = `<span class="${cls}">${label}: ${ret.toFixed(2)}%</span>`;
            }
        }
        
        // Fetch chart
        async function fetchChart(t, tf) {
            try {
                const res = await fetch(`/api/chart?ticker=${t}&tf=${tf}`);
                const data = await res.json();
                renderChart(data);
            } catch (e) {
                console.error('Chart error:', e);
            }
        }
        
        // Render chart
        function renderChart(data) {
            const ctx = document.getElementById('chart').getContext('2d');
            if (chart) chart.destroy();
            
            const datasets = [
                {
                    label: 'Price',
                    data: data.prices,
                    borderColor: '#58a6ff',
                    backgroundColor: 'rgba(88, 166, 255, 0.1)',
                    fill: true,
                    tension: 0.1,
                    pointRadius: 0,
                    yAxisID: 'y'
                },
                {
                    label: 'Volume',
                    data: data.volumes,
                    type: 'bar',
                    backgroundColor: 'rgba(139, 148, 158, 0.5)',
                    yAxisID: 'y1'
                }
            ];

            // Add Last Close line if available
            if (data.last_close) {
                datasets.push({
                    label: 'Last Close',
                    data: new Array(data.labels.length).fill(data.last_close),
                    borderColor: 'rgba(248, 81, 73, 0.8)',
                    borderDash: [5, 5],
                    borderWidth: 1.5,
                    pointRadius: 0,
                    fill: false,
                    yAxisID: 'y'
                });
            }
            
            const crosshairPlugin = {
                id: 'crosshair',
                afterDraw: chart => {
                    if (chart.tooltip && chart.tooltip._active && chart.tooltip._active.length) {
                        const activePoint = chart.tooltip._active[0];
                        const ctx = chart.ctx;
                        const x = activePoint.element.x;
                        const topY = chart.scales.y.top;
                        const bottomY = chart.scales.y.bottom;

                        ctx.save();
                        ctx.beginPath();
                        ctx.moveTo(x, topY);
                        ctx.lineTo(x, bottomY);
                        ctx.lineWidth = 1;
                        ctx.strokeStyle = '#8b949e';
                        ctx.setLineDash([4, 4]);
                        ctx.stroke();
                        ctx.restore();
                    }
                }
            };
            
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data.labels,
                    datasets: datasets
                },
                plugins: [crosshairPlugin],
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { 
                        legend: { display: false },
                        tooltip: {
                            mode: 'index',
                            intersect: false
                        }
                    },
                    scales: {
                        x: { 
                            display: timeframe === '1D',
                            grid: { display: false },
                            ticks: {
                                color: '#8b949e',
                                maxRotation: 0,
                                autoSkip: false,
                                callback: function(val, index) {
                                    const label = this.getLabelForValue(val);
                                    if (label === '09:30' || (label && label.indexOf(':00') !== -1)) return label;
                                    return null;
                                }
                            }
                        },
                        y: {
                            position: 'left',
                            type: useLogScale ? 'logarithmic' : 'linear',
                            grid: { color: '#30363d' },
                            ticks: { color: '#8b949e' }
                        },
                        y1: {
                            position: 'right',
                            grid: { display: false },
                            ticks: { display: false }
                        }
                    }
                }
            });
        }
        
        // Init
        window.onload = function() {
            setTimeframe('1D');
            fetchQuotes();
        };
        setInterval(fetchQuotes, 5000); // Live-ish update every 5 seconds

        // ---- 52-Week Highs panel ----
        let yhRows = [];
        let yhSortKey = 'pct_off';
        let yhSortDir = 1; // 1 asc, -1 desc
        let yhFilter = '';

        function yhFmtPrice(v) {
            return (v == null) ? '--' : '$' + Number(v).toFixed(2);
        }
        function yhFmtVol(v) {
            if (v == null) return '--';
            if (v >= 1e9) return (v / 1e9).toFixed(2) + 'B';
            if (v >= 1e6) return (v / 1e6).toFixed(2) + 'M';
            if (v >= 1e3) return (v / 1e3).toFixed(1) + 'K';
            return String(v);
        }
        function yhExchClass(ex) {
            return ex === 'NASDAQ' ? 'exch-nasdaq' : 'exch-nyse';
        }

        async function yhLoad() {
            const dateEl = document.getElementById('yhDate');
            const statusEl = document.getElementById('yhStatus');
            const errEl = document.getElementById('yhError');
            const emptyEl = document.getElementById('yhEmpty');
            errEl.style.display = 'none';
            emptyEl.style.display = 'none';
            const date = dateEl.value || '';
            let url = '/api/year-highs';
            if (yhFilter) {
                url = `/api/year-highs?action=search&q=${encodeURIComponent(yhFilter)}`;
            } else if (date) {
                url = `/api/year-highs?date=${encodeURIComponent(date)}`;
            }
            try {
                const res = await fetch(url);
                const data = await res.json();
                yhRows = (data.results || []).slice();
                statusEl.textContent = ` ${data.date || ''} · ${yhRows.length} names`;
                if (!yhRows.length) emptyEl.style.display = 'block';
                yhRender();
            } catch (e) {
                errEl.textContent = 'Failed to load 52-week highs: ' + e.message;
                errEl.style.display = 'block';
                console.error('year-highs error:', e);
            }
        }

        function yhRender() {
            const body = document.getElementById('yhBody');
            const rows = yhRows.slice().sort((a, b) => {
                const va = a[yhSortKey], vb = b[yhSortKey];
                if (va == null) return 1;
                if (vb == null) return -1;
                if (typeof va === 'number' && typeof vb === 'number') return (va - vb) * yhSortDir;
                return String(va).localeCompare(String(vb)) * yhSortDir;
            });
            body.innerHTML = rows.map(r => {
                const pct = (r.pct_off == null) ? '--' : r.pct_off.toFixed(2) + '%';
                const pctCls = (r.pct_off != null && r.pct_off > -0.5) ? 'pct-near' : '';
                return `<tr>
                    <td class="ticker">${r.ticker || ''}</td>
                    <td>${r.company || ''}</td>
                    <td>${r.sector || ''}</td>
                    <td class="${yhExchClass(r.exchange)}">${r.exchange || ''}</td>
                    <td>${yhFmtPrice(r.close)}</td>
                    <td class="${pctCls}">${pct}</td>
                    <td>${yhFmtVol(r.volume)}</td>
                </tr>`;
            }).join('');
            document.querySelectorAll('.yh-table th').forEach(th => {
                th.classList.toggle('active', th.dataset.k === yhSortKey);
            });
        }

        function yhSort(k) {
            if (yhSortKey === k) { yhSortDir *= -1; }
            else { yhSortKey = k; yhSortDir = 1; }
            yhRender();
        }

        function yhSearchInput() {
            const v = document.getElementById('yhSearch').value.trim();
            yhFilter = v;
            yhLoad();
        }

        // Init year-highs panel once DOM is ready
        (function yhInit() {
            const dEl = document.getElementById('yhDate');
            if (dEl && !dEl.value) {
                const today = new Date();
                const iso = today.toISOString().slice(0, 10);
                dEl.value = iso; // client-local default; API falls back to latest if no match
            }
            yhLoad();
        })();
    </script>
</body>
</html>
