<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Monitor | Alpha Terminal</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0d1117; color: #e6edf3; margin: 0; min-height: 100vh; }
        .header { background: #161b22; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #30363d; }

        .toolbar { background: #161b22; padding: 12px 24px; display: flex; gap: 12px; align-items: center; border-bottom: 1px solid #30363d; flex-wrap: wrap; }
        .toolbar h2 { font-size: 18px; font-weight: 600; margin: 0; }
        .toolbar .date-label { color: #8b949e; font-size: 13px; }
        .toolbar input[type="date"] { background: #0d1117; border: 1px solid #30363d; color: #e6edf3; padding: 8px 12px; border-radius: 6px; }
        .toolbar .status { color: #8b949e; font-size: 13px; margin-left: auto; }

        .nw-section { padding: 24px; }
        .nw-container { background: #161b22; border-radius: 8px; overflow: visible; border: 1px solid #21262d; }

        .nw-table { width: 100%; border-collapse: collapse; font-size: 14px; }
        .nw-table th, .nw-table td { text-align: left; padding: 8px 12px; }
        .nw-table th { background: #21262d; color: #8b949e; font-weight: 600; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; cursor: pointer; user-select: none; white-space: nowrap; border-bottom: 1px solid #30363d; }
        .nw-table th:hover { color: #e6edf3; background: #30363d; }
        .nw-table td { color: #c9d1d9; border-bottom: 1px solid #21262d; }

        .nw-table thead { position: sticky; top: 0; z-index: 1; }
        .nw-table thead .gradient-row td { padding: 0; height: 3px; background: linear-gradient(90deg, #1f6feb, #58a6ff); }
        .nw-table tbody tr:hover { background: rgba(48,54,61,0.4); }
        .nw-table tbody tr:nth-child(even) { background: rgba(255,255,255,0.02); }
        .nw-table tbody tr:nth-child(even):hover { background: rgba(48,54,61,0.5); }

        .news-tab { padding: 6px 14px; font-size: 13px; font-weight: 600; color: #8b949e; cursor: pointer; user-select: none; transition: background 0.2s, color 0.2s; border-radius: 6px; }
        .news-tab:hover { background: #1c2128; color: #c9d1d9; }
        .news-tab.active { background: #30363d; color: #e6edf3; }
        .ticker-input { background: #0d1117; border: 1px solid #30363d; color: #e6edf3; padding: 4px 8px; border-radius: 4px; font-size: 13px; width: 120px; }
        .ticker-badge { background: #238636; color: #fff; padding: 1px 6px; border-radius: 4px; font-size: 11px; font-weight: bold; white-space: nowrap; }

        a.news-link { text-decoration: none; color: inherit; display: block; }
        a.news-link:hover .headline-cell { color: #58a6ff; }
        .loading { text-align: center; color: #8b949e; padding: 20px; font-style: italic; }

        .sort-arrow { display: inline-block; margin-left: 4px; font-size: 11px; color: #c9d1d9; }
        .sort-arrow.asc::after { content: "▲"; color: #58a6ff; }
        .sort-arrow.desc::after { content: "▼"; color: #58a6ff; }
    </style>
</head>
<body>
    <div class="header"><div class="nav" id="header-container"></div></div>

    <div class="toolbar">
        <h2>📰 News</h2>
        <div style="display:flex;gap:4px;" id="nwTabs">
            <span class="news-tab active" data-tab="headline" onclick="nwSwitchTab('headline')">Headline</span>
            <span class="news-tab" data-tab="economics" onclick="nwSwitchTab('economics')">Economics</span>
            <span class="news-tab" data-tab="markets" onclick="nwSwitchTab('markets')">Markets</span>
            <span class="news-tab" data-tab="technologies" onclick="nwSwitchTab('technologies')">Technologies</span>
            <span class="news-tab" data-tab="ma" onclick="nwSwitchTab('ma')">M&A</span>
            <span class="news-tab" data-tab="cn" onclick="nwSwitchTab('cn')">Company News</span>
        </div>
        <input type="text" id="nwFilter" placeholder="Ticker" class="ticker-input" style="display:none;" oninput="nwRender()">
        <span class="status" id="nwStatus"></span>
    </div>

    <div class="nw-section">
        <div class="nw-container">
            <div id="nwTableWrap">
                <table class="nw-table" id="nwTable">
                    <thead>
                        <tr>
                            <th data-k="time" onclick="nwSort('time')">Time<span class="sort-arrow"></span></th>
                            <th data-k="headline" onclick="nwSort('headline')">Headline<span class="sort-arrow"></span></th>
                            <th data-k="summary" onclick="nwSort('summary')">Summary<span class="sort-arrow"></span></th>
                        </tr>
                        <tr class="gradient-row"><td colspan="3"></td></tr>
                    </thead>
                    <tbody id="nwBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let nwRows = [];
        let nwTab = 'headline';
        let nwSortKey = 'time';
        let nwSortDir = -1;

        // Initial load
        nwLoad();

        async function nwLoad() {
            const statusEl = document.getElementById('nwStatus');
            const url = '/api/news/top?cat=' + nwTab;
            statusEl.textContent = 'Loading...';
            try {
                const res = await fetch(url);
                const data = await res.json();
                nwRows = data || [];
                statusEl.textContent = nwRows.length + ' items';
                nwRender();
            } catch (e) {
                statusEl.textContent = 'Error';
                console.warn('nwLoad error:', e);
            }
        }

        function nwRender() {
            const body = document.getElementById('nwBody');
            if (!body || !nwRows) { body.innerHTML = ''; return; }

            let rows = [...nwRows];
            // Sort
            rows.sort((a, b) => {
                let va = a[nwSortKey], vb = b[nwSortKey];
                if (nwSortKey === 'time' || nwSortKey === 'datetime') {
                    va = a.datetime || 0; vb = b.datetime || 0;
                }
                if (typeof va === 'string') va = va.toLowerCase();
                if (typeof vb === 'string') vb = vb.toLowerCase();
                if (va < vb) return -1 * nwSortDir;
                if (va > vb) return 1 * nwSortDir;
                return 0;
            });

            // Apply ticker filter for company news tab
            const filterEl = document.getElementById('nwFilter');
            const filterVal = filterEl ? filterEl.value.trim().toUpperCase() : '';
            if (nwTab === 'cn' && filterVal) {
                rows = rows.filter(item =>
                    (item.ticker && item.ticker.toUpperCase() === filterVal) ||
                    (item.headline && item.headline.toUpperCase().includes(filterVal))
                );
            }

            let html = '';
            for (const item of rows) {
                const ts = item.datetime || 0;
                const timeStr = ts ? new Date(ts * 1000).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : '';
                const badge = (item.ticker)
                    ? `<span class="ticker-badge">${item.ticker}</span>`
                    : (item.related ? `<span class="ticker-badge" style="background:#1f6feb;">${item.related.split(',')[0]}</span>` : '');
                html += `<tr><td>${timeStr}</td><td><a href="${item.url}" target="_blank" class="news-link">${badge}${item.headline}</a></td><td style="color:#8b949e;font-size:13px;">${item.summary || ''}</td></tr>`;
            }
            body.innerHTML = html || '<tr><td colspan="3" class="loading">No items found</td></tr>';
        }

        function nwSort(key) {
            if (nwSortKey === key) nwSortDir *= -1;
            else { nwSortKey = key; nwSortDir = -1; }
            document.querySelectorAll('.nw-table th .sort-arrow').forEach(el => { el.className = 'sort-arrow'; });
            const th = document.querySelector(`.nw-table th[data-k="${key}"] .sort-arrow`);
            if (th) th.classList.add(nwSortDir === 1 ? 'asc' : 'desc');
            nwRender();
        }

        function nwSwitchTab(tab) {
            nwTab = tab;
            document.querySelectorAll('.news-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
            const filter = document.getElementById('nwFilter');
            if (filter) filter.style.display = (tab === 'cn') ? '' : 'none';
            nwLoad();
        }
    </script>
</body>
</html>
