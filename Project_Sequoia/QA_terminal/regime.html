<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Regime | Alpha Terminal</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
         background: #0d1117; color: #e6edf3; line-height: 1.5; -webkit-font-smoothing: antialiased; }

  .toolbar { background: #161b22; padding: 12px 24px; display: flex; gap: 14px; align-items: center;
             border-bottom: 1px solid #30363d; flex-wrap: wrap; }
  .toolbar h2 { font-size: 18px; font-weight: 600; margin: 0; }
  .status { color: #8b949e; font-size: 13px; margin-left: auto; }

  .section { padding: 16px 24px 24px; display: flex; flex-direction: column; gap: 14px; }

  /* active regime banner */
  .regime-banner { display: flex; align-items: center; gap: 20px; background: #161b22;
                   border: 1px solid #21262d; border-radius: 10px; padding: 16px 20px; flex-wrap: wrap; }
  .regime-pill { font-size: 26px; font-weight: 800; letter-spacing: .04em; padding: 8px 22px;
                 border-radius: 10px; color: #0d1117; min-width: 120px; text-align: center; }
  .regime-metrics { display: flex; gap: 22px; flex-wrap: wrap; }
  .rm { min-width: 76px; }
  .rm .rm-lbl { font-size: 10px; color: #8b949e; text-transform: uppercase; letter-spacing: .05em; }
  .rm .rm-val { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .rm .rm-flag { font-size: 11px; margin-top: 1px; font-variant-numeric: tabular-nums; }

  /* transition signal */
  .trans { background: #161b22; border: 1px solid #21262d; border-radius: 8px; padding: 10px 16px;
           font-size: 13px; color: #8b949e; }
  .trans b { color: #e6edf3; }
  .trans .arrow { font-size: 15px; }

  /* 6-gauge strip */
  .gauge-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
  .gauge { background: #161b22; border: 1px solid #21262d; border-radius: 8px; padding: 10px 14px; }
  .gauge-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 4px; }
  .gauge-name { font-size: 11px; color: #8b949e; text-transform: uppercase; letter-spacing: .05em; }
  .gauge-val { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .gauge-sub { font-size: 10px; color: #6e7681; font-variant-numeric: tabular-nums; }
  .gauge-bar { height: 6px; border-radius: 3px; background: #21262d; margin-top: 6px; overflow: hidden; }
  .gauge-bar > div { height: 100%; border-radius: 3px; }

  /* calendar */
  .panel { background: #161b22; border: 1px solid #21262d; border-radius: 8px; padding: 12px 16px; }
  .panel-title { font-size: 11px; color: #8b949e; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 8px; }
  .panel-title b { color: #e6edf3; }
  .chart-box { position: relative; height: 180px; }

  /* factor tilt table */
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { text-align: left; color: #8b949e; font-size: 10px; text-transform: uppercase;
       letter-spacing: .05em; padding: 6px 10px; border-bottom: 1px solid #30363d; }
  td { padding: 7px 10px; border-bottom: 1px solid #21262d; }
  tr:hover td { background: #1c2129; }
  .tilt-regime { font-weight: 700; font-variant-numeric: tabular-nums; }
  .tilt-desc { color: #8b949e; }

  .r-empty { color: #8b949e; font-size: 13px; padding: 24px; }
  .r-foot { padding: 8px 24px 14px; font-size: 10px; color: #8b949e; }
</style>
</head>
<body>

<div class="header"><div class="nav"></div></div>

<div class="toolbar">
  <h2>🔄 Regime</h2>
  <span class="status" id="status">NS-5 regime model · FRED + Yahoo</span>
</div>

<div class="section">
  <div id="regMain"><div class="r-empty">Loading regime data…</div></div>
</div>
<div class="r-foot" id="rFoot">Macro regime classification from the NS-5 regime model (growth × inflation taxonomy, 5 confirmation layers).
  Badge color = current regime; calendar shows the last 24 months.</div>

<script src="chart.js"></script>
<script>
// ================= Regime tab — NS-5 regime axis consumer =================
// Data: /api/regime -> {regime, confidence, flags, cpi_yoy, gdp_qoq, unrate,
//                       curve_bp, baa_aaa_bp, nfci, vix, corr, wti, as_of}
//       /api/regime/history?days=730 -> {history: [{date, regime, confidence, flags}]}

const REGIME_COLORS = { R1: '#3fb950', R2: '#f0883e', R3: '#f85149', R4: '#bd2c00' };
const REGIME_LABELS = { R1: 'EXPANSION', R2: 'OVERHEATING', R3: 'RECESSION', R4: 'STAGFLATION' };

const TILTS = [
  { regime: 'R1', name: 'EXPANSION',   factors: 'Momentum · Growth',       desc: '60/40 works. Bonds hedge stocks. Risk-on.' },
  { regime: 'R2', name: 'OVERHEATING', factors: 'Value · TIPS · Commodities', desc: 'Stocks OK, bonds bleed. Fed tightening. TIPS > nominals.' },
  { regime: 'R3', name: 'RECESSION',   factors: 'Duration · Quality · Defensives', desc: 'Fed cutting, curve steepening. Bonds rally.' },
  { regime: 'R4', name: 'STAGFLATION', factors: 'Cash · Gold · Commodities · TIPS', desc: 'Fed trapped. Real assets > financial.' },
];

let calChart = null;

function fmt(v, d=2){ return (v == null || isNaN(v)) ? '—' : Number(v).toFixed(d); }
function pct(v){ return (v == null || isNaN(v)) ? '—' : Number(v).toFixed(1) + '%'; }

function regimeColor(r){ return REGIME_COLORS[r] || '#8b949e'; }

// ── banner ────────────────────────────────────────────────────────────
function renderBanner(d){
  const pill = `<div class="regime-pill" style="background:${regimeColor(d.regime)}">
    ${REGIME_LABELS[d.regime] || d.regime} <span style="font-size:13px;opacity:.75">${fmt(d.confidence,2)}</span></div>`;
  const metrics = `
    <div class="rm"><div class="rm-lbl">CPI YoY</div><div class="rm-val">${pct(d.cpi_yoy)}</div><div class="rm-flag">target 2.0%</div></div>
    <div class="rm"><div class="rm-lbl">GDP QoQ</div><div class="rm-val">${pct(d.gdp_qoq)}</div><div class="rm-flag">threshold 2.0%</div></div>
    <div class="rm"><div class="rm-lbl">UNRATE</div><div class="rm-val">${pct(d.unrate)}</div><div class="rm-flag">3m Δ drives growth</div></div>
    <div class="rm"><div class="rm-lbl">2s10s</div><div class="rm-val">${fmt(d.curve_bp,0)}<span style="font-size:11px">bp</span></div><div class="rm-flag">inversion &lt; −10bp</div></div>
    <div class="rm"><div class="rm-lbl">BAA−AAA</div><div class="rm-val">${fmt(d.baa_aaa_bp,0)}<span style="font-size:11px">bp</span></div><div class="rm-flag">stress &gt; 200bp</div></div>
    <div class="rm"><div class="rm-lbl">VIX</div><div class="rm-val">${fmt(d.vix,1)}</div><div class="rm-flag">acute &gt; 28</div></div>
    <div class="rm"><div class="rm-lbl">NFCI</div><div class="rm-val">${fmt(d.nfci,2)}</div><div class="rm-flag">tight &gt; 0</div></div>
    <div class="rm"><div class="rm-lbl">WTI</div><div class="rm-val">${fmt(d.wti,0)}</div><div class="rm-flag">stagflation &gt; $100</div></div>
    <div class="rm"><div class="rm-lbl">Stock−Bond</div><div class="rm-val">${fmt(d.corr,2)}</div><div class="rm-flag">60d corr</div></div>`;
  const flags = d.flags ? `<div class="trans" style="margin-top:10px">Flags: <b>${d.flags}</b></div>` : '';
  return `<div class="regime-banner">${pill}<div class="regime-metrics">${metrics}</div></div>${flags}`;
}

// ── 6-gauge strip (confirmation layers) ───────────────────────────────
function gaugeBar(v, max, color){
  const p = Math.max(0, Math.min(1, (v == null || isNaN(v)) ? 0 : Math.abs(v) / max));
  return `<div class="gauge-bar"><div style="width:${(p*100).toFixed(0)}%;background:${color}"></div></div>`;
}
function renderGauges(d){
  const items = [
    { name:'Growth', val: pct(d.gdp_qoq), sub:'GDP QoQ ann · UNRATE 3m', v: d.gdp_qoq, max: 4, color:'#58a6ff' },
    { name:'Inflation', val: pct(d.cpi_yoy), sub:'CPI YoY · target 2.0%', v: d.cpi_yoy, max: 6, color:'#f0883e' },
    { name:'Monetary', val: fmt(d.curve_bp,0)+'bp', sub:'2s10s · Fed funds', v: d.curve_bp, max: 100, color:'#a371f7' },
    { name:'Credit', val: fmt(d.baa_aaa_bp,0)+'bp', sub:'BAA−AAA · NFCI', v: d.baa_aaa_bp, max: 300, color:'#f85149' },
    { name:'External', val: fmt(d.wti,0)+'$', sub:'WTI · USD', v: d.wti, max: 150, color:'#39c5cf' },
    { name:'Market', val: fmt(d.vix,1), sub:'VIX · stock-bond corr', v: d.vix, max: 40, color:'#e3b341' },
  ];
  return `<div class="gauge-strip">` + items.map(g => `
    <div class="gauge">
      <div class="gauge-head"><div class="gauge-name">${g.name}</div><div class="gauge-val" style="color:${g.color}">${g.val}</div></div>
      <div class="gauge-sub">${g.sub}</div>${gaugeBar(g.v, g.max, g.color)}
    </div>`).join('') + `</div>`;
}

// ── 24-month regime calendar ──────────────────────────────────────────
function renderCalendar(history){
  // aggregate history into per-month dominant regime
  const byMonth = {};
  history.forEach(h => {
    const m = h.date.slice(0,7);
    if (!byMonth[m]) byMonth[m] = {};
    byMonth[m][h.regime] = (byMonth[m][h.regime] || 0) + 1;
  });
  const months = Object.keys(byMonth).sort().slice(-24);
  const labels = months.map(m => m.slice(2));
  const datasets = ['R1','R2','R3','R4'].map(r => ({
    label: r, data: months.map(m => byMonth[m][r] || 0),
    backgroundColor: REGIME_COLORS[r], stack: 'regime', borderWidth: 0,
  }));
  if (calChart) { calChart.destroy(); calChart = null; }
  calChart = new Chart(document.getElementById('calChart'), {
    type: 'bar',
    data: { labels, datasets },
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      scales: {
        x: { stacked: true, ticks: { color:'#8b949e', font:{size:10} }, grid:{ color:'#21262d' } },
        y: { stacked: true, ticks: { color:'#8b949e', font:{size:10} }, grid:{ color:'#21262d' } },
      },
      plugins: {
        legend: { labels: { color: '#8b949e', font: { size: 10 }, boxWidth: 10 } },
        tooltip: { callbacks: { label: (ctx) => ` ${ctx.dataset.label}: ${ctx.parsed.y} days` } },
      },
    },
  });
}

// ── factor tilt table ─────────────────────────────────────────────────
function renderTilts(){
  const rows = TILTS.map(t => `
    <tr>
      <td class="tilt-regime" style="color:${regimeColor(t.regime)}">${t.name}</td>
      <td>${t.factors}</td>
      <td class="tilt-desc">${t.desc}</td>
    </tr>`).join('');
  return `<div class="panel"><div class="panel-title"><b>Factor tilt by regime</b> — optimal tilt if the regime fires</div>
    <table><thead><tr><th>Regime</th><th>Factor tilt</th><th>What it means</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

// ── transition signal ─────────────────────────────────────────────────
function renderTransition(history){
  if (history.length < 2) return '';
  const last = history[history.length-1], prev = history[history.length-2];
  if (last.regime === prev.regime) return '';
  return `<div class="trans">🔄 <b>Transition</b> — regime changed from
    <b style="color:${regimeColor(prev.regime)}">${REGIME_LABELS[prev.regime]||prev.regime}</b>
    <span class="arrow">→</span>
    <b style="color:${regimeColor(last.regime)}">${REGIME_LABELS[last.regime]||last.regime}</b>
    on ${last.date} (confidence ${fmt(last.confidence,2)})</div>`;
}

// ── load ──────────────────────────────────────────────────────────────
async function loadRegime(){
  const main = document.getElementById('regMain');
  try {
    const [r1, r2] = await Promise.all([
      fetch('/api/regime').then(r => r.json()),
      fetch('/api/regime/history?days=730').then(r => r.json()),
    ]);
    const d = r1, history = (r2 && r2.history) || [];
    if (!d || d.regime === 'N/A') {
      main.innerHTML = `<div class="r-empty">No regime data available${d && d.error ? ' — ' + d.error : ''}.
        The NS-5 regime pipeline must run once (FRED_API_KEY) to populate the store.</div>`;
      return;
    }
    main.innerHTML =
      renderBanner(d) +
      renderTransition(history) +
      renderGauges(d) +
      `<div class="panel"><div class="panel-title"><b>Regime calendar</b> — 24 months, days per regime</div>
         <div class="chart-box"><canvas id="calChart"></canvas></div></div>` +
      renderTilts();
    renderCalendar(history);
  } catch (e) {
    main.innerHTML = `<div class="r-empty" style="color:#f85149">Failed to load regime data: ${e.message}</div>`;
  }
}

loadRegime();
</script>
</body>
</html>
