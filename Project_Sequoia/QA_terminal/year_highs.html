<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alpha Terminal - 52-Week Highs</title>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0d1117; color: #e6edf3; min-height: 100vh; }
        .header { background: #161b22; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #30363d; }
        .header h1 { font-size: 20px; font-weight: 600; }
        .nav { display: flex; gap: 16px; }
        .nav a { color: #8b949e; text-decoration: none; padding: 8px 16px; border-radius: 6px; }
        .nav a.active { background: #21262d; color: #e6edf3; }
        
        .toolbar { background: #161b22; padding: 12px 24px; display: flex; gap: 12px; align-items: center; border-bottom: 1px solid #30363d; flex-wrap: wrap; }
        .toolbar h2 { font-size: 18px; font-weight: 600; margin: 0; }
        .toolbar .date-label { color: #8b949e; font-size: 13px; }
        .toolbar input[type="date"] { background: #0d1117; border: 1px solid #30363d; color: #e6edf3; padding: 8px 12px; border-radius: 6px; }
        .toolbar .status { color: #8b949e; font-size: 13px; margin-left: auto; }
        select { background: #0d1117; color: #e6edf3; border: 1px solid #30363d; padding: 6px; border-radius: 4px; }

        .yh-section { padding: 24px; }

        .yh-table { width: 100%; border-collapse: collapse; font-size: 14px; }
        .yh-table th, .yh-table td {
            text-align: left;
            padding: 8px 12px;
            border-bottom: 1px solid #21262d;
        }
        .yh-table th {
            color: #8b949e;
            text-transform: uppercase;
            font-size: 11px;
            cursor: pointer;
            user-select: none;
        }
        .yh-table th:hover { color: #e6edf3; }
        .yh-table th.active { color: #58a6ff; }
        .yh-table th .sort-arrow {
            display: inline-block;
            width: 12px;
            height: 12px;
            opacity: 0.4;
            transition: opacity 0.15s;
            vertical-align: middle;
            margin-left: 2px;
        }
        .yh-table th.active .sort-arrow { opacity: 1; }
        .yh-table th .sort-arrow.asc::before {
            content: '▲';
            display: block;
            font-size: 8px;
            line-height: 1;
            color: currentColor;
        }
        .yh-table th .sort-arrow.desc::before {
            content: '▼';
            display: block;
            font-size: 8px;
            line-height: 1;
            color: currentColor;
        }
        .yh-table tbody tr:nth-child(even) { background: rgba(255, 255, 255, 0.03); }
        .yh-table tbody tr:hover { background: #21262d; }
        .yh-table .ticker { font-weight: 700; color: #e6edf3; }
        .yh-table .exch-nyse { color: #58a6ff; }
        .yh-table .exch-nasdaq { color: #3fb950; }
        .yh-table td { color: #c9d1d9; }
        .yh-empty, .yh-error { color: #8b949e; padding: 16px; }
        .yh-error { color: #f85149; }
    </style>
</head>
<body>
    <div class="header"><div class="nav"></div></div>

    <div class="toolbar">
        <h2>📈 52-Week Highs</h2>
        <span class="date-label">Session:</span>
        <input type="date" id="yhDate" onchange="yhLoad()">
        <span class="status" id="yhStatus"></span>
    </div>

    <div class="yh-section">
        <div id="yhTableWrap">
            <table class="yh-table" id="yhTable">
                <thead>
                    <tr>
                        <th data-k="ticker" onclick="yhSort('ticker')">Ticker<span class="sort-arrow"></span></th>
                        <th data-k="company" onclick="yhSort('company')">Company<span class="sort-arrow"></span></th>
                        <th data-k="sector" onclick="yhSort('sector')">Sector<span class="sort-arrow"></span></th>
                        <th data-k="exchange" onclick="yhSort('exchange')">Exchange<span class="sort-arrow"></span></th>
                        <th data-k="close" onclick="yhSort('close')">Price<span class="sort-arrow"></span></th>
                        <th data-k="market_cap" onclick="yhSort('market_cap')">Market Cap (B)<span class="sort-arrow"></span></th>
                        <th data-k="volume" onclick="yhSort('volume')">Volume<span class="sort-arrow"></span></th>
                    </tr>
                </thead>
                <tbody id="yhBody"></tbody>
            </table>
            <div class="yh-empty" id="yhEmpty" style="display:none;">No 52-week highs stored for this session.</div>
            <div class="yh-error" id="yhError" style="display:none;"></div>
        </div>
    </div>

    <script>
        // ---- 52-Week Highs panel ----
        let yhRows = [];
        let yhSortKey = 'pct_off';
        let yhSortDir = 1;

        function yhFmtPrice(v) {
            return (v == null) ? '--' : '$' + Number(v).toFixed(2);
        }
        function yhFmtMktCap(v) {
            if (v == null) return '--';
            return '$' + (v / 1e9).toFixed(2) + 'B';
        }
        function yhFmtVol(v) {
            if (v == null) return '--';
            if (v >= 1e9) return (v / 1e9).toFixed(2) + 'B';
            if (v >= 1e6) return (v / 1e6).toFixed(2) + 'M';
            if (v >= 1e3) return (v / 1e3).toFixed(1) + 'K';
            return String(v);
        }
        function yhExchClass(ex) {
            return ex === 'NASDAQ' ? 'exch-nasdaq' : 'exch-nyse';
        }

        async function yhLoad() {
            const dateEl = document.getElementById('yhDate');
            const statusEl = document.getElementById('yhStatus');
            const errEl = document.getElementById('yhError');
            const emptyEl = document.getElementById('yhEmpty');
            errEl.style.display = 'none';
            emptyEl.style.display = 'none';
            const date = dateEl.value || '';
            let url = '/api/year-highs';
            if (date) {
                url = `/api/year-highs?date=${encodeURIComponent(date)}`;
            }
            try {
                const res = await fetch(url);
                const data = await res.json();
                // Filter: only stocks at 52W high (pct_off >= 0)
                yhRows = (data.results || []).filter(r => r.pct_off != null && r.pct_off >= 0);
                statusEl.textContent = ` ${data.date || ''} · ${yhRows.length} names at 52W high`;
                if (!yhRows.length) emptyEl.style.display = 'block';
                yhRender();
            } catch (e) {
                errEl.textContent = 'Failed to load 52-week highs: ' + e.message;
                errEl.style.display = 'block';
                console.error('year-highs error:', e);
            }
        }

        function yhRender() {
            const body = document.getElementById('yhBody');
            const rows = yhRows.slice().sort((a, b) => {
                const va = a[yhSortKey], vb = b[yhSortKey];
                if (va == null) return 1;
                if (vb == null) return -1;
                if (typeof va === 'number' && typeof vb === 'number') return (va - vb) * yhSortDir;
                return String(va).localeCompare(String(vb)) * yhSortDir;
            });
            body.innerHTML = rows.map(r => {
                const pct = (r.pct_off == null) ? '--' : r.pct_off.toFixed(2) + '%';
                const pctCls = (r.pct_off != null && r.pct_off > -0.5) ? 'pct-near' : '';
                return `<tr>
                    <td class="ticker">${r.ticker || ''}</td>
                    <td>${r.company || ''}</td>
                    <td>${r.sector || ''}</td>
                    <td class="${yhExchClass(r.exchange)}">${r.exchange || ''}</td>
                    <td>${yhFmtPrice(r.close)}</td>
                    <td>${yhFmtMktCap(r.market_cap)}</td>
                    <td>${yhFmtVol(r.volume)}</td>
                </tr>`;
            }).join('');
            document.querySelectorAll('.yh-table th').forEach(th => {
                const isActive = th.dataset.k === yhSortKey;
                th.classList.toggle('active', isActive);
                const arrow = th.querySelector('.sort-arrow');
                if (isActive) {
                    // Arrow points DOWN for descending (yhSortDir === -1), UP for ascending (yhSortDir === 1)
                    arrow.classList.toggle('asc', yhSortDir === 1);
                    arrow.classList.toggle('desc', yhSortDir === -1);
                }
            });
        }

        function yhSort(k) {
            if (yhSortKey === k) { yhSortDir *= -1; }
            else { yhSortKey = k; yhSortDir = 1; }
            yhRender();
        }

        (async function yhInit() {
            const dEl = document.getElementById('yhDate');
            // Fetch available dates and set date picker to latest available
            try {
                const res = await fetch('/api/year-highs?action=calendar');
                const data = await res.json();
                if (data.dates && data.dates.length > 0) {
                    dEl.value = data.dates[0];  // Latest available date
                    dEl.max = data.dates[0];    // Can't pick future dates
                }
            } catch (e) {
                console.warn('Could not fetch calendar dates:', e);
            }
            if (dEl && !dEl.value) {
                const today = new Date();
                dEl.value = today.toISOString().slice(0, 10);
            }
            yhLoad();
        })();
    </script>
</body>
</html>
