<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alpha Terminal - OMON</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0d1117; color: #e6edf3; min-height: 100vh; }
        .header { background: #161b22; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #30363d; }
        .header h1 { font-size: 20px; font-weight: 600; }
        .nav { display: flex; gap: 16px; }
        .nav a { color: #8b949e; text-decoration: none; padding: 8px 16px; border-radius: 6px; }
        .nav a.active { background: #21262d; color: #e6edf3; }
        .chain-table tr.illiquid { opacity: 0.4; }
        .parity-badge { color: #f85149; font-size: 11px; margin-left: 3px; cursor: pointer; }
        .chain-table tr.parity-violation .strike-cell { color: #f85149; font-weight: 600; }
        .parity-pop { position: fixed; z-index: 1000; background: #161b22; border: 1px solid #f85149; border-radius: 6px; padding: 10px 12px; font-size: 12px; color: #e6edf3; box-shadow: 0 4px 16px rgba(0,0,0,0.5); width: 260px; line-height: 1.6; }
        .parity-pop-title { color: #f85149; font-weight: 600; margin-bottom: 4px; }
        .parity-pop-res { margin-top: 4px; color: #f85149; font-weight: 600; }
        .parity-pop-note { margin-top: 6px; color: #8b949e; font-size: 11px; }
        
        .toolbar { background: #161b22; padding: 12px 24px; display: flex; gap: 12px; align-items: center; border-bottom: 1px solid #30363d; flex-wrap: wrap; }
        .search { background: #0d1117; border: 1px solid #30363d; color: #e6edf3; padding: 8px 12px; border-radius: 6px; width: 120px; }
        .btn { background: #238636; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; }
        .btn:hover { background: #2ea043; }
        .btn-secondary { background: #21262d; border: 1px solid #30363d; color: #e6edf3; }
        .btn-secondary:hover { background: #30363d; }
        
        .omain { padding: 24px; display: flex; flex-direction: column; gap: 16px; }
        
        .chain-container { display: block; background: #161b22; border-radius: 8px; overflow-x: auto; }
        .chain-table { width: 100%; border-collapse: collapse; font-size: 11px; }
        .chain-table th { padding: 8px 2px; background: #21262d; color: #8b949e; position: sticky; top: 0; z-index: 10; font-weight: 600; text-transform: uppercase; border-bottom: 1px solid #30363d; }
        .chain-table td { padding: 6px 2px; text-align: right; border-bottom: 1px solid #21262d; }
        .chain-table .strike-cell { background: #0d1117; font-weight: 700; text-align: center; color: #e6edf3; width: 80px; font-size: 13px; }
        .chain-table tr:hover td { background: #21262d; }
        .chain-table .call-side { border-right: 1px solid #30363d; }
        .chain-table .put-side { border-left: 1px solid #30363d; }
        .itm-call { background: rgba(63, 185, 80, 0.05); }
        .itm-put { background: rgba(248, 81, 73, 0.05); }
        .atm-row td { background: rgba(88, 166, 255, 0.15); font-weight: 600; }
        .atm-row .strike-cell { color: #58a6ff; }
        .greek { color: #58a6ff; font-weight: 500; }
        .iv-cell { transition: background-color 0.3s; }
        .expected-move { color: #3fb950; font-size: 14px; font-weight: 600; }
        .smile-chart { margin-top: 16px; background: #161b22; border-radius: 8px; padding: 12px; }
        .gex-chart { margin-top: 16px; background: #161b22; border-radius: 8px; padding: 12px; }
        .gex-chart .gex-title { color: #8b949e; font-size: 12px; margin-bottom: 6px; }
        .gex-chart .gex-title .gex-sub { color: #58a6ff; margin-left: 8px; }
        .gex-legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 8px; font-size: 11px; color: #8b949e; }
        .gex-legend-item { display: flex; align-items: center; gap: 5px; }
        .gex-swatch { width: 10px; height: 10px; display: inline-block; border-radius: 2px; }
        .gex-swatch.line { height: 0; border-top: 2px solid; border-radius: 0; }
        .gex-swatch.dashed { width: 14px; height: 0; border-top: 2px dashed; border-radius: 0; }
        .gex-swatch.shade { background: repeating-linear-gradient(90deg, rgba(63,185,80,0.25) 0 4px, rgba(248,81,73,0.25) 4px 8px); }
        
        .info-bar { background: #161b22; padding: 12px 24px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
        .info-bar .ticker { font-size: 24px; font-weight: 700; }
        .info-bar .spot { font-size: 24px; }
        .loading { padding: 40px; text-align: center; color: #8b949e; }
        select { background: #0d1117; color: #e6edf3; border: 1px solid #30363d; padding: 6px; border-radius: 4px; }
        
        .watchlist-select { background: #0d1117; color: #e6edf3; border: 1px solid #30363d; padding: 8px 12px; border-radius: 6px; min-width: 150px; }
        .watchlist-bar { display: flex; align-items: center; gap: 8px; }
        .watchlist-bar label { color: #8b949e; font-size: 12px; }
        .watchlist-edit { display: flex; gap: 8px; margin-left: 12px; }
        .watchlist-edit input { background: #0d1117; border: 1px solid #30363d; color: #e6edf3; padding: 6px 10px; border-radius: 4px; width: 100px; font-size: 13px; }
    </style>
</head>
<body>
    <div class="header">
        <div style="display: flex; align-items: center; gap: 12px;">
            <h1>🛠️ Alpha Terminal</h1>
            <div class="time" id="time" style="color: #8b949e; font-size: 14px;">--:--:--</div>
        </div>
        <div class="nav" style="display: flex; gap: 16px; margin-left: auto;">
            <a href="dashboard.html" style="color: #8b949e; text-decoration: none; padding: 8px 16px; border-radius: 6px;">Dashboard</a>
            <a href="omon.html" class="active" style="background: #21262d; color: #e6edf3; text-decoration: none; padding: 8px 16px; border-radius: 6px;">OMON</a>
            <a href="screener.html" style="color: #8b949e; text-decoration: none; padding: 8px 16px; border-radius: 6px;">Option Screener</a>
            <a href="ratio.html" style="color: #8b949e; text-decoration: none; padding: 8px 16px; border-radius: 6px;">Ratio Analysis</a>
            <a href="financials.html" style="color: #8b949e; text-decoration: none; padding: 8px 16px; border-radius: 6px;">Financial Analyzer</a>
            <a href="estimates.html">Earnings Estimates</a>
        </div>
    </div>
    
    <div class="toolbar">
        <div class="watchlist-bar">
            <label>Watchlist:</label>
            <select id="watchlistSelect" class="watchlist-select" onchange="loadFromWatchlist()">
                <option value="">-- Select --</option>
            </select>
            <button class="btn" onclick="removeFromWatchlist()" style="padding: 6px 10px; font-size: 14px; background: #f85149; color: white; border: none; font-weight: bold;" title="Remove">-</button>
        </div>
        <input type="text" class="search" id="ticker" placeholder="SPY" value="SPY">
        <button class="btn" onclick="fetchExpirations()">Load</button>
        <button class="btn" onclick="addToWatchlist()" style="padding: 8px 12px;" title="Add to Watchlist">+</button>
        <select id="expirySelect" onchange="loadOptions()"></select>
    </div>
    
    <div class="omain">
        <div class="info-bar">
            <div class="ticker" id="qtTicker">SPY</div>
            <div class="spot" id="qtSpot">Spot: --</div>
            <div class="last-trade" id="qtLast" style="font-size:14px;color:#8b949e;">--</div>
            <div id="qtExpiryDisplay" style="font-size:18px;font-weight:600;color:#58a6ff;">--</div>
            <div class="expected-move" id="qtExpectedMove" title="ATM straddle (call mid + put mid at strike nearest spot)">Exp. move: --</div>
            <div>
                <label style="color:#8b949e;font-size:12px;">View:</label>
                <select id="viewMode" onchange="renderChain()">
                    <option value="otm">20 OTM (10c/10p)</option>
                    <option value="violations">⚠ Parity Violations</option>
                    <option value="all">All Strikes</option>
                </select>
            </div>
        </div>
        
        <div class="chain-container" id="chainContainer">
            <div class="loading">Enter ticker and click Load</div>
        </div>
    </div>
    
    <script>
        // Update time
        function updateTime() {
            const now = new Date();
            const timeEl = document.getElementById('time');
            if (timeEl) timeEl.textContent = now.toLocaleTimeString();
        }
        setInterval(updateTime, 1000);
        updateTime();

        let optionsData = null;
        let spotPrice = 0;
        let watchlist = ['SPY', 'QQQ', 'IWM', 'TLT'];
        try {
            if (localStorage.getItem('omonWatchlist')) {
                watchlist = JSON.parse(localStorage.getItem('omonWatchlist'));
            }
        } catch(e) {}
        
        function saveWatchlist() {
            try { localStorage.setItem('omonWatchlist', JSON.stringify(watchlist)); } catch(e) {}
            renderWatchlist();
        }
        
        function renderWatchlist() {
            const select = document.getElementById('watchlistSelect');
            const tickerEl = document.getElementById('ticker');
            if (!tickerEl) return;
            const current = tickerEl.value.toUpperCase().trim();
            select.innerHTML = '<option value="">-- Select --</option>';
            watchlist.forEach(ticker => {
                const opt = document.createElement('option');
                opt.value = ticker;
                opt.textContent = ticker;
                if (ticker === current) opt.selected = true;
                select.appendChild(opt);
            });
        }
        
        function loadFromWatchlist() {
            const ticker = document.getElementById('watchlistSelect').value;
            if (ticker) {
                document.getElementById('ticker').value = ticker;
                fetchExpirations();
            }
        }
        
        function addToWatchlist() {
            const ticker = document.getElementById('ticker').value.toUpperCase().trim();
            if (ticker && !watchlist.includes(ticker)) {
                watchlist.push(ticker);
                watchlist.sort();
                saveWatchlist();
            }
        }
        
        function removeFromWatchlist() {
            const ticker = document.getElementById('watchlistSelect').value;
            if (ticker) {
                const idx = watchlist.indexOf(ticker);
                if (idx > -1) {
                    watchlist.splice(idx, 1);
                    saveWatchlist();
                }
            }
        }
        
        async function fetchExpirations() {
            const ticker = document.getElementById('ticker').value.toUpperCase().trim();
            if (!ticker) return;
            renderWatchlist();
            
            try {
                const res = await fetch(`/api/expirations?ticker=${ticker}`);
                const data = await res.json();
                
                const select = document.getElementById('expirySelect');
                select.innerHTML = '';
                
                data.standard.forEach(e => {
                    const opt = document.createElement('option');
                    opt.value = e.date;
                    opt.textContent = e.label;
                    select.appendChild(opt);
                });
                
                if (data.standard.length > 0) {
                    const divider = document.createElement('option');
                    divider.disabled = true;
                    divider.textContent = "──────────";
                    select.appendChild(divider);
                }
                
                data.expirations.forEach(e => {
                    const opt = document.createElement('option');
                    opt.value = e;
                    opt.textContent = e;
                    select.appendChild(opt);
                });
                
                // Default to the nearest standard monthly (3rd-Friday) expiry -
                // the most liquid chain. Weeklies are wide/illiquid; never
                // default to the nearest weekly.
                if (data.standard.length > 0) {
                    select.value = data.standard[0].date;
                } else if (data.expirations.length > 0) {
                    select.value = data.expirations[0];
                }
                
                loadOptions();
            } catch (e) {
                console.error(e);
            }
        }
        
        async function loadOptions() {
            const ticker = document.getElementById('ticker').value.toUpperCase().trim();
            const expiry = document.getElementById('expirySelect').value;
            if (!ticker || !expiry) return;
            
            document.getElementById('chainContainer').innerHTML = '<div class="loading">Loading...</div>';
            
            try {
                const res = await fetch(`/api/options?ticker=${ticker}&expiry=${expiry}`);
                optionsData = await res.json();
                
                spotPrice = optionsData.spot || 0;
                
                document.getElementById('qtTicker').textContent = ticker;
                document.getElementById('qtSpot').textContent = 'Spot: $' + spotPrice.toFixed(2);
                document.getElementById('qtExpiryDisplay').textContent = expiry;
                
                const em = optionsData.expectedMove;
                document.getElementById('qtExpectedMove').textContent = em
                    ? `Exp. move: $${em.straddle.toFixed(2)} (±${em.pct.toFixed(1)}%)`
                    : 'Exp. move: --';
                
                const quoteRes = await fetch(`/api/quotes?tickers=${ticker}`);
                const quoteData = await quoteRes.json();
                const quote = quoteData[ticker];
                if (quote) {
                    const changeSign = quote.change >= 0 ? '+' : '';
                    document.getElementById('qtLast').textContent = 
                        `Last: $${quote.price.toFixed(2)} (${changeSign}${quote.change.toFixed(2)} / ${changeSign}${quote.change_pct.toFixed(2)}%)`;
                }
                
                renderChain();
            } catch (e) {
                console.error('Load error:', e);
                document.getElementById('chainContainer').innerHTML = '<div class="loading">Error: ' + e.message + '</div>';
            }
        }
        
        function renderChain() {
            if (!optionsData) return;
            const calls = optionsData.calls || [];
            const puts = optionsData.puts || [];
            const viewMode = document.getElementById('viewMode')?.value || 'otm';
            
            const strikeSet = new Set();
            calls.forEach(c => strikeSet.add(c.strike));
            puts.forEach(p => strikeSet.add(p.strike));
            let sortedStrikes = Array.from(strikeSet).sort((a, b) => a - b);
            
            if (viewMode === 'otm') {
                const callOtm = sortedStrikes.filter(s => s > spotPrice).slice(0, 10);
                const putOtm = sortedStrikes.filter(s => s < spotPrice).reverse().slice(0, 10).reverse();
                sortedStrikes = [...putOtm, ...callOtm];
            } else if (viewMode === 'violations') {
                // Exception report: only strikes where put-call parity fails.
                const callMapV = {};
                calls.forEach(c => callMapV[c.strike] = c);
                const putMapV = {};
                puts.forEach(p => putMapV[p.strike] = p);
                sortedStrikes = sortedStrikes.filter(s =>
                    (callMapV[s] && callMapV[s].parityOk === false) ||
                    (putMapV[s] && putMapV[s].parityOk === false));
            }
            
            const callMap = {};
            calls.forEach(c => callMap[c.strike] = c);
            const putMap = {};
            puts.forEach(p => putMap[p.strike] = p);
            
            function fmtNum(n) { return n ? n.toLocaleString() : '-'; }
            function fmtPct(n) { return n ? (n*100).toFixed(1) + '%' : '-'; }
            // Spread % display: widen to 2 decimals under 1% so tight quotes
            // don't all render as "0.0%"
            function fmtSpreadPct(n) {
                if (n === null || n === undefined) return '';
                return (n < 1 ? n.toFixed(2) : n.toFixed(1)) + '%';
            }
            // IV smile coloring: heat-map the IV cell by moneyness-relative IV.
            // High IV (vs chain range) = warm (red), low = cool (blue).
            let ivMin = Infinity, ivMax = -Infinity;
            function computeIvRange() {
                ivMin = Infinity; ivMax = -Infinity;
                [calls, puts].forEach(list => list.forEach(o => {
                    if (o.iv && o.iv > 0.01) {
                        ivMin = Math.min(ivMin, o.iv);
                        ivMax = Math.max(ivMax, o.iv);
                    }
                }));
                if (ivMin === Infinity) { ivMin = 0; ivMax = 1; }
            }
            function ivColor(iv) {
                if (!iv || iv <= 0.01) return '';
                const t = (iv - ivMin) / (ivMax - ivMin || 1);  // 0=cool .. 1=hot
                // cool blue -> neutral -> hot red
                const r = Math.round(60 + t * 195);
                const g = Math.round(120 + (0.5 - Math.abs(t - 0.5)) * 120);
                const b = Math.round(200 - t * 150);
                return `background: rgba(${r},${g},${b},0.18);`;
            }
            function fmtProb(p) { return p === null || p === undefined ? '-' : (p * 100).toFixed(1) + '%'; }
            function rowClass(opt) {
                // Dim illiquid rows (no two-sided quote); mark parity violations
                const cls = [];
                if (opt && opt.illiquid) cls.push('illiquid');
                if (opt && opt.parityOk === false) cls.push('parity-violation');
                return cls.join(' ');
            }
            function spreadTitle(opt) {
                if (!opt || !opt.hasQuote) return 'No two-sided quote (stale/illiquid)';
                return `Spread: $${opt.spread} (${fmtSpreadPct(opt.spreadPct)})`;
            }
            function parityBadge(opt, strike) {
                if (opt && opt.parityOk === false && opt.parityResidual !== null && opt.parityResidual !== undefined) {
                    const sign = opt.parityResidual > 0 ? '+' : '';
                    return `<span class="parity-badge" title="Put-call parity off by $${sign}${opt.parityResidual} — click for details" onclick="showParityPop(event, ${strike})">⚠</span>`;
                }
                return '';
            }
            
            let html = `
                <table class="chain-table">
                    <thead>
                        <tr>
                            <th colspan="10" style="color:#3fb950;border-bottom:2px solid #3fb950;">CALLS</th>
                            <th class="strike-cell">STRIKE</th>
                            <th colspan="10" style="color:#f85149;border-bottom:2px solid #f85149;">PUTS</th>
                        </tr>
                        <tr>
                            <th class="greek">Vega</th><th class="greek">Theta</th><th class="greek">Gamma</th><th class="greek">Delta</th>
                            <th>IV</th><th>P(ITM)</th><th>OI</th><th>Vol</th><th>Last</th><th>Bid</th><th>Ask</th>
                            <th class="strike-cell">Price</th>
                            <th>Bid</th><th>Ask</th><th>Last</th><th>Vol</th><th>OI</th><th>P(ITM)</th><th>IV</th>
                            <th class="greek">Delta</th><th class="greek">Gamma</th><th class="greek">Theta</th><th class="greek">Vega</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            
            // Find ATM strike (closest to spot)
            let atmStrike = null;
            let minDiff = Infinity;
            sortedStrikes.forEach(s => {
                const diff = Math.abs(s - spotPrice);
                if (diff < minDiff) {
                    minDiff = diff;
                    atmStrike = s;
                }
            });
            
            computeIvRange();  // for IV smile coloring

            sortedStrikes.forEach(s => {
                const c = callMap[s] || {};
                const p = putMap[s] || {};
                const c_itm = s < spotPrice ? 'itm-call' : '';
                const p_itm = s > spotPrice ? 'itm-put' : '';
                const isATM = s === atmStrike ? ' atm-row' : '';
                
                html += `
                    <tr class="${isATM} ${rowClass(c)} ${rowClass(p)}">
                        <td class="call-side ${c_itm} greek">${c.vega?.toFixed(3) || '-'}</td>
                        <td class="call-side ${c_itm} greek">${c.theta?.toFixed(3) || '-'}</td>
                        <td class="call-side ${c_itm} greek">${c.gamma?.toFixed(4) || '-'}</td>
                        <td class="call-side ${c_itm} greek">${c.delta?.toFixed(3) || '-'}</td>
                        <td class="call-side ${c_itm} iv-cell" style="${ivColor(c.iv)}" title="IV: ${c.iv ? (c.iv*100).toFixed(1) + '%' : '-'}">${fmtPct(c.iv)}</td>
                        <td class="call-side ${c_itm}">${fmtProb(c.probITM)}</td>
                        <td class="call-side ${c_itm}">${fmtNum(c.oi)}</td>
                        <td class="call-side ${c_itm}">${fmtNum(c.vol)}</td>
                        <td class="call-side ${c_itm}">${c.last?.toFixed(2) || '-'}</td>
                        <td class="call-side ${c_itm}" title="${spreadTitle(c)}">${c.bid?.toFixed(2) || '-'}</td>
                        <td class="call-side ${c_itm}" title="${spreadTitle(c)}">${c.ask?.toFixed(2) || '-'}</td>
                        
                        <td class="strike-cell">${s.toFixed(1)}${parityBadge(c, s)}</td>
                        
                        <td class="put-side ${p_itm}" title="${spreadTitle(p)}">${p.bid?.toFixed(2) || '-'}</td>
                        <td class="put-side ${p_itm}" title="${spreadTitle(p)}">${p.ask?.toFixed(2) || '-'}</td>
                        <td class="put-side ${p_itm}">${p.last?.toFixed(2) || '-'}</td>
                        <td class="put-side ${p_itm}">${fmtNum(p.vol)}</td>
                        <td class="put-side ${p_itm}">${fmtNum(p.oi)}</td>
                        <td class="put-side ${p_itm}">${fmtProb(p.probITM)}</td>
                        <td class="put-side ${p_itm} iv-cell" style="${ivColor(p.iv)}" title="IV: ${p.iv ? (p.iv*100).toFixed(1) + '%' : '-'}">${fmtPct(p.iv)}</td>
                        <td class="put-side ${p_itm} greek">${p.delta?.toFixed(3) || '-'}</td>
                        <td class="put-side ${p_itm} greek">${p.gamma?.toFixed(4) || '-'}</td>
                        <td class="put-side ${p_itm} greek">${p.theta?.toFixed(3) || '-'}</td>
                        <td class="put-side ${p_itm} greek">${p.vega?.toFixed(3) || '-'}</td>
                    </tr>
                `;
            });
            
            html += `</tbody></table>`;
            if (sortedStrikes.length === 0) {
                html = `<div class="loading" style="padding:24px;color:#3fb950;">✅ No parity violations — all quoted strikes agree with the chain consensus.</div>`;
            }
            document.getElementById('chainContainer').innerHTML = html;
            renderGexChart();
            renderSmileChart();
        }
        
        // IV smile: IV vs strike for calls + puts (visible in otm/all views).
        let smileChart = null;
        // IV at the option strike nearest `strike`, as a % (null if none).
        // Mirrors cValid/pValid so the readout matches the plotted smile.
        function ivAtStrike(list, strike) {
            if (!list || !list.length) return null;
            let best = null, bd = Infinity;
            for (const o of list) {
                if (!o.iv || o.iv <= 0.01 || o.parityOk === false) continue;
                const d = Math.abs(o.strike - strike);
                if (d < bd) { bd = d; best = o.iv; }
            }
            return best == null ? null : best * 100;
        }
        // Crosshair tracking the cursor across ALL strikes (not just dots),
        // with a call + put IV readout at the hovered strike.
        const crosshairPlugin = {
            id: 'crosshair',
            x: null,
            start(chart) {
                this.x = null;
                const cv = chart.canvas;
                const move = e => {
                    const r = cv.getBoundingClientRect();
                    this.x = e.clientX - r.left;
                    chart.draw();
                };
                const leave = () => { this.x = null; chart.draw(); };
                cv.addEventListener('mousemove', move);
                cv.addEventListener('mouseleave', leave);
                this._off = () => { cv.removeEventListener('mousemove', move); cv.removeEventListener('mouseleave', leave); };
            },
            stop() { if (this._off) this._off(); },
            afterDraw(chart) {
                const x = this.x;
                if (x == null) return;
                const area = chart.chartArea;
                if (x < area.left || x > area.right) return;
                // category x-scale: getValueForPixel is the label INDEX
                const idx = Math.round(chart.scales.x.getValueForPixel(x));
                const labels = chart.data.labels;
                const strike = (idx >= 0 && idx < labels.length) ? labels[idx] : null;
                const ctx = chart.ctx;
                ctx.save();
                // vertical dashed line along the hovered strike
                ctx.beginPath();
                ctx.moveTo(x, area.top);
                ctx.lineTo(x, area.bottom);
                ctx.lineWidth = 1;
                ctx.strokeStyle = '#8b949e';
                ctx.setLineDash([4, 4]);
                ctx.stroke();
                // call + put IV readout at the hovered strike
                if (strike != null) {
                    const callIv = ivAtStrike(optionsData && optionsData.calls, strike);
                    const putIv = ivAtStrike(optionsData && optionsData.puts, strike);
                    if (callIv != null || putIv != null) {
                        const parts = ['S' + strike.toFixed(1)];
                        if (callIv != null) parts.push('C' + callIv.toFixed(1) + '%');
                        if (putIv != null) parts.push('P' + putIv.toFixed(1) + '%');
                        const label = parts.join('  ');
                        ctx.setLineDash([]);
                        ctx.font = '11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
                        const tw = ctx.measureText(label).width;
                        const boxW = tw + 12, boxH = 18;
                        const bx = Math.min(Math.max(x - boxW / 2, area.left + 2), area.right - boxW - 2);
                        const by = area.top + 4;
                        ctx.fillStyle = '#21262d';
                        ctx.fillRect(bx, by, boxW, boxH);
                        ctx.strokeStyle = '#8b949e';
                        ctx.lineWidth = 1;
                        ctx.strokeRect(bx, by, boxW, boxH);
                        ctx.fillStyle = '#e6edf3';
                        ctx.textBaseline = 'middle';
                        ctx.textAlign = 'left';
                        ctx.fillText(label, bx + 6, by + boxH / 2 + 0.5);
                    }
                }
                ctx.restore();
            }
        };
        // ===================================================================
        // Gamma Exposure (GEX): per-strike call/put gamma from the SELECTED
        // chain (OI * gamma * spot * 100). Placed between the chain table and
        // the IV smile. No date picker — it always reflects the loaded chain.
        // ===================================================================
        let gexChart = null;
        let gexMeta = null;   // computed series shared with the draw plugin

        function fmtCompact(n) {
            if (n === null || n === undefined || isNaN(n)) return '-';
            const abs = Math.abs(n);
            if (abs >= 1e9) return (n / 1e9).toFixed(2) + 'B';
            if (abs >= 1e6) return (n / 1e6).toFixed(2) + 'M';
            if (abs >= 1e3) return (n / 1e3).toFixed(1) + 'K';
            return n.toFixed(0);
        }

        // Round a bin width up to a "nice" number (1/2/5 × 10^k).
        function niceBin(b) {
            if (!(b > 0)) return 1;
            const p = Math.pow(10, Math.floor(Math.log10(b)));
            const m = b / p;
            let nm = 1;
            if (m > 1) nm = 2;
            if (m > 2) nm = 5;
            if (m > 5) nm = 10;
            return nm * p;
        }

        function computeGex(spot) {
            // Focus on the liquid moneyness band around spot (deep-OTM wings
            // with sparse strikes would otherwise stretch the x-axis and pull
            // the gamma-flip to a meaningless far strike).
            const WIN = 0.25;              // ±25% of spot
            const lo = spot * (1 - WIN), hi = spot * (1 + WIN);
            // Accumulate call (+) and put (−) dollar gamma by strike.
            const byStrike = {};
            const fold = (list, sign) => {
                if (!list) return;
                for (const o of list) {
                    if (!o || o.strike == null) continue;
                    const K = o.strike;
                    if (K < lo || K > hi) continue;
                    const gex = (o.oi || 0) * (o.gamma || 0) * spot * 100;
                    if (gex === 0) continue;
                    if (!byStrike[K]) byStrike[K] = { K, call: 0, put: 0 };
                    if (sign > 0) byStrike[K].call += gex;
                    else byStrike[K].put += gex;   // stored as positive magnitude
                }
            };
            fold(optionsData.calls, 1);
            fold(optionsData.puts, -1);

            const strikes = Object.values(byStrike).sort((a, b) => a.K - b.K);
            if (!strikes.length) return null;

            // True call / put walls from the raw per-strike data (real strike
            // values used for the labels even though bars are binned).
            let maxCall = { K: null, v: -Infinity }, maxPut = { K: null, v: -Infinity };
            for (const s of strikes) {
                if (s.call > maxCall.v) maxCall = { K: s.K, v: s.call };
                if (s.put > maxPut.v) maxPut = { K: s.K, v: s.put };   // magnitude
            }

            // Adaptive binning: high-priced tickers (SPY at ~$770) have a
            // strike every $2, which would render hundreds of thin bars. Bin
            // to ~55 buckets so the histogram stays readable at any price.
            const binSize = niceBin((hi - lo) / 55);
            const bins = new Map();
            for (const s of strikes) {
                const cKey = Math.floor(s.K / binSize) * binSize;
                let b = bins.get(cKey);
                if (!b) { b = { cKey, call: 0, put: 0 }; bins.set(cKey, b); }
                b.call += s.call;
                b.put += s.put;
            }
            const binList = [...bins.values()].sort((a, b) => a.cKey - b.cKey);

            const labels = [], callBars = [], putBars = [], agg = [];
            let cum = 0, maxAbs = 0;
            for (const b of binList) {
                const center = b.cKey + binSize / 2;
                const call = +b.call.toFixed(2);
                const put = -(+b.put.toFixed(2));       // negative magnitude
                const net = call + put;
                cum += net;
                labels.push(center);
                callBars.push({ x: center, y: call });
                putBars.push({ x: center, y: put });
                agg.push({ x: center, y: +cum.toFixed(2) });
                maxAbs = Math.max(maxAbs, Math.abs(call), Math.abs(put));
            }

            // Zero crossings of the cumulative aggregate line = where net GEX
            // flips sign (the "gamma flip"). Interpolate between adjacent bins.
            const crossings = [];
            for (let i = 1; i < agg.length; i++) {
                const y1 = agg[i - 1].y, y2 = agg[i].y;
                if (y1 === 0) crossings.push(agg[i - 1].x);
                else if (y2 === 0) crossings.push(agg[i].x);
                else if ((y1 < 0 && y2 > 0) || (y1 > 0 && y2 < 0)) {
                    const t = (0 - y1) / (y2 - y1);
                    crossings.push(+(agg[i - 1].x + t * (agg[i].x - agg[i - 1].x)).toFixed(2));
                }
            }
            // Split the axis into contiguous positive/negative gamma zones for
            // the background shading (green = positive, red = negative).
            const edges = [agg[0].x, ...crossings, agg[agg.length - 1].x];
            const regions = [];
            let positive = agg[0].y >= 0;
            for (let i = 0; i < edges.length - 1; i++) {
                regions.push({ from: edges[i], to: edges[i + 1], positive });
                positive = !positive;
            }
            // Flip = the crossing nearest spot (the pivot of price magnetism).
            let flip = null;
            if (crossings.length) {
                let best = Infinity;
                for (const c of crossings) {
                    const d = Math.abs(c - spot);
                    if (d < best) { best = d; flip = c; }
                }
            }
            return { labels, callBars, putBars, agg, maxCall, maxPut, flip, regions, maxAbs, binSize };
        }

        // Draws the shading zones, gamma-flip / last-price lines, and the
        // call/put wall annotations on top of the chart.js render.
        const gexPlugin = {
            id: 'gex',
            beforeDatasetsDraw(chart) {
                if (!gexMeta || !gexMeta.regions) return;
                const xs = chart.scales.x, area = chart.chartArea;
                if (!xs || !area) return;
                const ctx = chart.ctx;
                const h = area.bottom - area.top;
                ctx.save();
                for (const r of gexMeta.regions) {
                    const left = xs.getPixelForValue(r.from);
                    const right = xs.getPixelForValue(r.to);
                    // Positive gamma regime (green), negative regime (red).
                    ctx.fillStyle = r.positive ? 'rgba(63, 185, 80, 0.06)' : 'rgba(248, 81, 73, 0.06)';
                    ctx.fillRect(left, area.top, right - left, h);
                }
                ctx.restore();
            },
            afterDraw(chart) {
                if (!gexMeta) return;
                const xs = chart.scales.x, ys = chart.scales.y;
                const area = chart.chartArea;
                if (!xs || !ys || !area) return;
                const ctx = chart.ctx;
                const font = '11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
                ctx.save();
                ctx.font = font;
                ctx.textBaseline = 'middle';

                // Gamma flip vertical line + label (orange).
                if (gexMeta.flip != null) {
                    const px = xs.getPixelForValue(gexMeta.flip);
                    ctx.setLineDash([4, 4]);
                    ctx.strokeStyle = '#f0883e';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath(); ctx.moveTo(px, area.top); ctx.lineTo(px, area.bottom); ctx.stroke();
                    ctx.setLineDash([]);
                    ctx.fillStyle = '#f0883e';
                    ctx.textAlign = 'center';
                    ctx.fillText('Flip ' + gexMeta.flip.toFixed(2), px, area.top + 9);
                }

                // Last price (spot) vertical line + label (grey).
                if (gexMeta.spot != null) {
                    const px = xs.getPixelForValue(gexMeta.spot);
                    ctx.setLineDash([4, 4]);
                    ctx.strokeStyle = '#8b949e';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath(); ctx.moveTo(px, area.top); ctx.lineTo(px, area.bottom); ctx.stroke();
                    ctx.setLineDash([]);
                    ctx.fillStyle = '#8b949e';
                    ctx.textAlign = 'center';
                    ctx.fillText('Last ' + gexMeta.spot.toFixed(2), px, area.bottom - 9);
                }

                // Call wall: tallest green bar, labelled above it.
                if (gexMeta.maxCall && gexMeta.maxCall.K != null && isFinite(gexMeta.maxCall.v)) {
                    const px = xs.getPixelForValue(gexMeta.maxCall.K);
                    const topY = ys.getPixelForValue(gexMeta.maxCall.v);
                    ctx.fillStyle = '#3fb950';
                    ctx.textAlign = 'center';
                    ctx.fillText('Call Wall ' + gexMeta.maxCall.K.toFixed(0), px, Math.max(area.top + 14, topY - 8));
                }

                // Put wall: most-negative red bar, labelled below it.
                if (gexMeta.maxPut && gexMeta.maxPut.K != null && isFinite(gexMeta.maxPut.v)) {
                    const px = xs.getPixelForValue(gexMeta.maxPut.K);
                    const botY = ys.getPixelForValue(-gexMeta.maxPut.v);
                    ctx.fillStyle = '#f85149';
                    ctx.textAlign = 'center';
                    ctx.fillText('Put Wall ' + gexMeta.maxPut.K.toFixed(0), px, Math.min(area.bottom - 14, botY + 14));
                }
                ctx.restore();
            }
        };

        function renderGexChart() {
            const container = document.getElementById('chainContainer');
            if (!container || typeof Chart === 'undefined') return;
            const existing = document.getElementById('gexChartWrap');
            if (existing) existing.remove();
            if (gexChart) { gexChart.destroy(); gexChart = null; }

            const viewMode = document.getElementById('viewMode')?.value || 'otm';
            if (viewMode === 'violations' || !optionsData) return;   // skip in exception view
            const spot = optionsData.spot;
            if (!spot) return;

            const meta = computeGex(spot);
            if (!meta) return;
            gexMeta = Object.assign({}, meta, { spot });

            const wrap = document.createElement('div');
            wrap.id = 'gexChartWrap';
            wrap.className = 'gex-chart';
            const expiryLabel = optionsData.expiry || '';
            wrap.innerHTML =
                `<div class="gex-title">Gamma Exposure<span class="gex-sub">Expiry: ${expiryLabel}</span></div>` +
                `<canvas id="gexCanvas" height="80"></canvas>` +
                `<div class="gex-legend">` +
                    `<span class="gex-legend-item"><span class="gex-swatch" style="background:#3fb950;"></span>Call</span>` +
                    `<span class="gex-legend-item"><span class="gex-swatch" style="background:#f85149;"></span>Put</span>` +
                    `<span class="gex-legend-item"><span class="gex-swatch shade"></span>Net</span>` +
                    `<span class="gex-legend-item"><span class="gex-swatch dashed" style="border-color:#f0883e;"></span>Gamma Flip</span>` +
                    `<span class="gex-legend-item"><span class="gex-swatch line" style="border-color:#58a6ff;"></span>Aggregate GEX</span>` +
                    `<span class="gex-legend-item"><span class="gex-swatch dashed" style="border-color:#8b949e;"></span>Last Price</span>` +
                `</div>`;
            container.appendChild(wrap);

            const canvas = document.getElementById('gexCanvas');
            const ctx = canvas.getContext('2d');
            const pad = meta.maxAbs * 1.15;
            // Hug the data: bound the strike axis to the rendered bins so a
            // concentrated chain fills the width instead of leaving an empty
            // gap to a "nice" rounded axis limit.
            const firstX = meta.callBars[0].x;
            const lastX = meta.callBars[meta.callBars.length - 1].x;
            const xPad = meta.binSize * 0.6;

            gexChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: meta.labels,
                    datasets: [
                        { label: 'Call', data: meta.callBars, type: 'bar', backgroundColor: '#3fb950', hoverBackgroundColor: '#2ea043', yAxisID: 'y', borderWidth: 0 },
                        { label: 'Put', data: meta.putBars, type: 'bar', backgroundColor: '#f85149', hoverBackgroundColor: '#da3633', yAxisID: 'y', borderWidth: 0 },
                        { label: 'Aggregate GEX', data: meta.agg, type: 'line', borderColor: '#58a6ff', backgroundColor: 'rgba(88,166,255,0.08)', pointRadius: 0, pointHitRadius: 8, borderWidth: 2, tension: 0.3, spanGaps: true, yAxisID: 'y1' }
                    ]
                },
                options: {
                    responsive: true,
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: c => {
                                    if (c.dataset.label === 'Aggregate GEX') return c.dataset.label + ': $' + fmtCompact(c.parsed.y);
                                    return c.dataset.label + ' GEX: $' + fmtCompact(c.parsed.y);
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            type: 'linear',
                            min: firstX - xPad,
                            max: lastX + xPad,
                            title: { display: true, text: 'Strike Price', color: '#8b949e', font: { size: 11 } },
                            ticks: { color: '#8b949e', font: { size: 10 }, callback: v => v.toFixed(0) },
                            grid: { color: 'rgba(255,255,255,0.05)' }
                        },
                        y: {
                            position: 'left',
                            title: { display: true, text: 'Gamma ($)', color: '#8b949e', font: { size: 11 } },
                            min: -pad, max: pad,
                            ticks: { color: '#8b949e', font: { size: 10 }, callback: v => fmtCompact(v) },
                            grid: { color: 'rgba(255,255,255,0.05)' }
                        },
                        y1: {
                            position: 'right',
                            title: { display: true, text: 'Aggregate GEX ($)', color: '#8b949e', font: { size: 11 } },
                            ticks: { color: '#8b949e', font: { size: 10 }, callback: v => fmtCompact(v) },
                            grid: { drawOnChartArea: false }
                        }
                    }
                },
                plugins: [gexPlugin]
            });
        }

        function renderSmileChart() {
            const container = document.getElementById('chainContainer');
            if (!container || typeof Chart === 'undefined') return;
            const existing = document.getElementById('smileChartWrap');
            if (existing) existing.remove();
            if (smileChart) { smileChart.destroy(); smileChart = null; }
            
            const viewMode = document.getElementById('viewMode')?.value || 'otm';
            if (viewMode === 'violations' || !optionsData) return;  // skip in exception view
            
            const calls = optionsData.calls || [];
            const puts = optionsData.puts || [];
            const cValid = calls.filter(c => c.iv && c.iv > 0.01 && c.parityOk !== false);
            const pValid = puts.filter(p => p.iv && p.iv > 0.01 && p.parityOk !== false);
            if (cValid.length < 3 || pValid.length < 3) return;
            
            const wrap = document.createElement('div');
            wrap.id = 'smileChartWrap';
            wrap.className = 'smile-chart';
            wrap.innerHTML = '<div style="color:#8b949e;font-size:12px;margin-bottom:6px;">IV Smile (valid quotes, parity-clean)</div><canvas id="smileCanvas" height="80"></canvas>';
            container.appendChild(wrap);
            
            const canvas = document.getElementById('smileCanvas');
            const ctx = canvas.getContext('2d');
            const sorted = (list) => [...list].sort((a, b) => a.strike - b.strike);
            smileChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: sorted(cValid).map(c => c.strike),
                    datasets: [
                        { label: 'Calls', data: sorted(cValid).map(c => +(c.iv * 100).toFixed(1)), borderColor: '#3fb950', backgroundColor: 'rgba(63,185,80,0.08)', pointRadius: 2, tension: 0.3 },
                        { label: 'Puts', data: sorted(pValid).map(p => +(p.iv * 100).toFixed(1)), borderColor: '#f85149', backgroundColor: 'rgba(248,81,73,0.08)', pointRadius: 2, tension: 0.3 }
                    ]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { labels: { color: '#8b949e', font: { size: 11 } } },
                        tooltip: { callbacks: { label: ctx => ctx.dataset.label + ': ' + ctx.parsed.y.toFixed(1) + '%' } }
                    },
                    scales: {
                        x: { title: { display: true, text: 'Strike', color: '#8b949e', font: { size: 11 } }, ticks: { color: '#8b949e', font: { size: 10 } }, grid: { color: 'rgba(255,255,255,0.05)' } },
                        y: { title: { display: true, text: 'IV %', color: '#8b949e', font: { size: 11 } }, ticks: { color: '#8b949e', font: { size: 10 } }, grid: { color: 'rgba(255,255,255,0.05)' } }
                    }
                },
                plugins: [crosshairPlugin]
            });
        }
        
        // ===================================================================
        // Put-call parity popover (GLOBAL scope - the inline onclick on the
        // ⚠ badge requires these to be reachable from the rendered HTML).
        // ===================================================================
        function showParityPop(e, strike) {
            e.stopPropagation();
            const existing = document.getElementById('parityPop');
            if (existing) existing.remove();
            const c = (optionsData.calls || []).find(o => o.strike === strike) || {};
            const p = (optionsData.puts || []).find(o => o.strike === strike) || {};
            const fwd = c.impliedForward ?? p.impliedForward;
            const med = optionsData.medianForward;
            const res = c.parityResidual ?? p.parityResidual;
            const pop = document.createElement('div');
            pop.id = 'parityPop';
            pop.className = 'parity-pop';
            const fmt = n => (n === null || n === undefined) ? '-' : '$' + n.toFixed(2);
            const cMid = ((c.bid || 0) + (c.ask || 0)) / 2;
            const pMid = ((p.bid || 0) + (p.ask || 0)) / 2;
            pop.innerHTML = `
                <div class="parity-pop-title">Put-Call Parity @ ${strike.toFixed(1)}</div>
                <div>Call mid: <b>${fmt(cMid)}</b></div>
                <div>Put mid: <b>${fmt(pMid)}</b></div>
                <div>Implied forward: <b>${fmt(fwd)}</b></div>
                <div>Chain median forward: <b>${fmt(med)}</b></div>
                <div class="parity-pop-res">Residual: <b>${res === null || res === undefined ? '-' : (res > 0 ? '+' : '') + '$' + res.toFixed(2)}</b></div>
                <div class="parity-pop-note">⚠ = this strike's implied forward deviates from the chain consensus — likely a stale/mispriced quote.</div>`;
            pop.style.left = Math.min(e.clientX + 12, window.innerWidth - 280) + 'px';
            pop.style.top = Math.min(e.clientY + 12, window.innerHeight - 200) + 'px';
            document.body.appendChild(pop);
        }
        function closeParityPop() {
            const el = document.getElementById('parityPop');
            if (el) el.remove();
        }
        document.addEventListener('click', closeParityPop);
        
        renderWatchlist();
        fetchExpirations();
    </script>
    <script src="chart.js"></script>
</body>
